<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="法硕工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>法硕（非法本）在职备考工作台</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff;
  --ink:#1e2433; --ink2:#48505f; --muted:#7c8798;
  --line:#e7ecf5; --line2:#f0f3fa;
  --brand:#5b7cfa; --brand2:#7f9bff; --brand-soft:#eef2ff;
  --teal:#2fb3a0; --teal-soft:#e6f7f4;
  --amber:#cf9224; --amber-soft:#fdf4e2;
  --red:#d95f5f; --red-soft:#fdecec;
  --green:#2f9e6e; --green-soft:#e7f7ef;
  --violet:#8a6fe0; --violet-soft:#f1ecfd;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 28px rgba(28,40,72,.07);
  --shadow-sm:0 2px 8px rgba(28,40,72,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 620px at 8% -12%, #e8edff 0%, rgba(232,237,255,0) 62%),
    radial-gradient(900px 520px at 102% -4%, #e6f7f3 0%, rgba(230,247,243,0) 58%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
p{margin:0}
button{font-family:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd8e8;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(160%) blur(14px);
  background:rgba(248,250,255,.82);
  border-bottom:1px solid var(--line);
}
.bar-inner{
  max-width:1120px;margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;
  background:linear-gradient(135deg,#6e8bff,#5b7cfa 55%,#4f6ef0);
  box-shadow:0 6px 16px rgba(91,124,250,.35);
}
.brand strong{display:block;font-size:15.5px;line-height:1.25}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;letter-spacing:.4px}
.nav{
  display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  margin-left:auto;padding:3px;background:#fff;border:1px solid var(--line);
  border-radius:999px;box-shadow:var(--shadow-sm);
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:transparent;color:var(--ink2);
  padding:7px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;
  white-space:nowrap;transition:background .16s,color .16s;
}
.nav button:hover{background:#f2f5fd;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,#6b8bff,#5b7cfa);color:#fff;box-shadow:0 4px 12px rgba(91,124,250,.28)}
.save-state{
  font-size:11.5px;color:var(--muted);white-space:nowrap;
  padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);
}
.save-state.flash{color:var(--green);border-color:#bfe9d5;background:var(--green-soft)}
.sync-state{
  font-size:11.5px;color:var(--muted);white-space:nowrap;cursor:pointer;
  padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);
}
.sync-state::before{content:'●';margin-right:5px;color:#c3ccdd}
.sync-state.ok{color:var(--green);border-color:#bfe9d5;background:var(--green-soft)}
.sync-state.ok::before{color:var(--green)}
.sync-state.busy{color:var(--brand);border-color:#cdd9ff;background:var(--brand-soft)}
.sync-state.busy::before{color:var(--brand);animation:pulse 1s infinite}
.sync-state.pending{color:var(--amber);border-color:#f0dfb8;background:var(--amber-soft)}
.sync-state.pending::before{color:var(--amber)}
.sync-state.off{color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink2);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:none;
}
.icon-btn:hover{background:#f2f5fd;color:var(--brand);border-color:#cdd9ff}

/* ---------- layout ---------- */
.view{max-width:1120px;margin:0 auto;padding:22px 18px 90px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.card + .card{margin-top:16px}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-title h2{font-size:16px}
.section-title .spacer{margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;background:#f2f5fc;color:var(--ink2);
  padding:8px 14px;border-radius:var(--radius-sm);font-size:13.5px;
  cursor:pointer;transition:transform .12s,background .16s,box-shadow .16s,color .16s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:#e9eefa;color:var(--ink)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.primary{background:linear-gradient(135deg,#6b8bff,#5b7cfa);color:#fff;box-shadow:0 6px 14px rgba(91,124,250,.26)}
.btn.primary:hover{background:linear-gradient(135deg,#6183ff,#4f70f2);color:#fff}
.btn.teal{background:var(--teal-soft);color:#1c7d6f;border-color:#cdeee7}
.btn.teal:hover{background:#d8f2ed}
.btn.danger{background:var(--red-soft);color:#b84242;border-color:#f6d5d5}
.btn.danger:hover{background:#fbe0e0}
.btn.ghost{background:#fff;border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:#f7f9ff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{
  border:0;background:transparent;color:var(--muted);font-size:15px;
  width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center;
}
.icon-btn:hover{background:#f0f3fb;color:var(--ink)}
.app-title{cursor:pointer;border-radius:8px;padding:2px 4px;margin-left:-4px;transition:background .16s,color .16s}
.app-title:hover{background:#eef3ff;color:var(--brand)}

/* ---------- inputs ---------- */
label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=url],textarea,select{
  width:100%;min-width:0;max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fbfcff;color:var(--ink);font-size:14px;font-family:inherit;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
input:focus,textarea:focus,select:focus{
  outline:0;border-color:var(--brand2);background:#fff;
  box-shadow:0 0 0 3px rgba(91,124,250,.13);
}
textarea{resize:vertical;min-height:96px;line-height:1.6}
input[type=file]{
  font-size:12.5px;color:var(--muted);padding:7px;border:1px dashed var(--line);
  border-radius:10px;background:#fbfcff;width:100%;
}
.search{max-width:260px}

/* ---------- badges / chips ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;background:#f1f4fb;color:var(--ink2);border:1px solid var(--line);
  white-space:nowrap;
}
.badge.blue{background:var(--brand-soft);color:#3f5bd0;border-color:#dbe4ff}
.badge.teal{background:var(--teal-soft);color:#1c7d6f;border-color:#cdeee7}
.badge.green{background:var(--green-soft);color:#1f7c53;border-color:#c8e9d9}
.badge.amber{background:var(--amber-soft);color:#8f6413;border-color:#f2e0bc}
.badge.red{background:var(--red-soft);color:#b84242;border-color:#f6d5d5}
.badge.violet{background:var(--violet-soft);color:#6247bd;border-color:#e2d8fb}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  background:#f5f7fd;border:1px solid var(--line);font-size:12px;color:var(--ink2);
}

/* ---------- progress ---------- */
.bar{height:9px;border-radius:99px;background:#edf1f9;overflow:hidden;position:relative}
.bar > i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#7f9bff,#5b7cfa);
  transition:width .4s ease;
}
.bar.teal > i{background:linear-gradient(90deg,#5fd0bf,#2fb3a0)}
.bar.amber > i{background:linear-gradient(90deg,#f0c46a,#cf9224)}
.bar.green > i{background:linear-gradient(90deg,#74d3a6,#2f9e6e)}
.bar.thin{height:6px}
.bar.big{height:13px}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(150deg,#ffffff 0%,#f7f9ff 48%,#f2f7ff 100%);
  border:1px solid #e4eaf9;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,#dbe4ff 0%,rgba(219,228,255,0) 70%);
}
.hero-label{font-size:12.5px;color:var(--muted);letter-spacing:.6px}
.hero-value{font-size:44px;font-weight:700;line-height:1.15;letter-spacing:-1px}
.hero-value span{font-size:20px;font-weight:600;color:var(--muted);margin-left:2px}
.hero-formula{font-size:12.5px;color:var(--ink2);margin-top:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.2px}
.stat .s{font-size:11.5px;color:var(--muted)}

/* ---------- accordion ---------- */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.acc + .acc{margin-top:8px}
.acc-head{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;
  background:#fff;border:0;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);
}
.acc-head:hover{background:#f8faff}
.acc-head .chev{transition:transform .18s;color:var(--muted);font-size:11px;width:12px}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-body{padding:4px 14px 14px;display:none}
.acc.open .acc-body{display:block}
.acc-body .line{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;color:var(--ink2)}
.acc-body .line .bar{flex:1;min-width:70px}
.rvline{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;color:var(--ink2)}
.rvline .rvlab{flex:0 0 76px;white-space:nowrap}
.rvline .rvpct{flex:0 0 46px;text-align:right;white-space:nowrap}
.rvline .bar{flex:1;min-width:70px}
/* 分科目轮次 / 打卡积分 */
.srline{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.srline:first-of-type{border-top:0}
.sr-name{flex:0 0 auto;font-weight:600;color:var(--ink)}
.sr-meta{flex:0 0 auto}
.srline .bar{flex:1;min-width:70px}
.sr-pct{flex:0 0 40px;text-align:right}
.day-done{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2)}
.ptline{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;border-top:1px solid var(--line2)}
.pt-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink2);
  border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.pt-chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.pt-chip:hover{background:#f7f9ff}
html[data-theme="dark"] .pt-chip{background:#1b2430;border-color:#2b3644}
html[data-theme="dark"] .pt-chip:hover{background:#212c3a}
html[data-theme="warm"] .pt-chip{background:#fffdf8;border-color:#e7ddcc}
@media (max-width:640px){ .pt-chip{padding:5px 8px;font-size:12px} }
.ptline:first-of-type{border-top:0}
.pt-pts{color:var(--green,#2ba36b);font-size:13px}
html[data-theme="dark"] .srline,html[data-theme="dark"] .ptline{border-top-color:#26303e}

/* ---------- 知识点统计 ---------- */
.kb-wrap{border:1px solid var(--line2);border-radius:12px;background:var(--card2,#f8fafd);padding:10px 12px;margin-bottom:12px}
.kb-head{cursor:pointer;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.kb-head::-webkit-details-marker,.kb-subj > summary::-webkit-details-marker{display:none}
.kb-body{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.kb-subj{border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:#fff}
.kb-subj > summary{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;list-style:none}
.kb-bars{display:inline-flex;gap:2px;width:110px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;flex:none}
.kb-bars b{display:block;height:100%}
.kb-bars .ok{background:#3aa675}
.kb-bars .bad{background:#d9534f}
.kb-list{display:flex;flex-direction:column;gap:2px;margin:7px 0 2px 4px;border-left:2px solid var(--line2);padding-left:10px}
.kb-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:3px 0}
.kb-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-row .pct{flex:none;font-variant-numeric:tabular-nums}

/* ---------- 按天打卡 ---------- */
.daylist{display:flex;flex-direction:column;gap:8px}
.day{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.day > summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;font-size:13.5px}
.day > summary::-webkit-details-marker{display:none}
.day.today{border-color:#c9d6ff}
.day.today > summary{background:linear-gradient(90deg,#f4f7ff,#fdfdff)}
.day .d-date{font-weight:600}
.day-body{padding:4px 12px 10px}
.task-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px dashed var(--line2);font-size:13px}
.task-row:first-child{border-top:0}
.task-row .tname{flex:1;min-width:0}
.task-row .tname b{font-weight:600}
.task-row .tmeta{color:var(--muted);font-size:12px;margin-left:2px}
.task-row .tmins{color:var(--muted);font-size:12px;flex:none}
.task-row.checked .tname{color:var(--muted);text-decoration:line-through}
.day-count{font-size:12px;color:var(--muted)}

/* ---------- tree ---------- */
.tree{display:flex;flex-direction:column;gap:7px}
.node{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.node.subj{border-color:#e2e8f6}
.node-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:#fdfdff}
.node.subj > .node-head{background:linear-gradient(180deg,#fbfcff,#f6f8ff)}
.node-head:hover{background:#f7f9ff}
.node-head .t{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-head .chev{color:var(--muted);font-size:11px;width:12px;transition:transform .18s}
.node.open > .node-head .chev{transform:rotate(90deg)}
.node-body{padding:0 10px 10px 26px;display:none;flex-direction:column;gap:6px}
.node.open > .node-body{display:flex}
.pin{border:0;background:transparent;cursor:pointer;font-size:13px;opacity:.35;padding:2px 4px;border-radius:6px}
.pin.on{opacity:1;background:var(--amber-soft)}
.lesson{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);
  border-radius:10px;background:#fff;
}
.lesson.done{background:#fbfefc;border-color:#e2f2e9}
.lesson .lname{flex:1;min-width:0}
.lesson .lname .n{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .lname .o{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.play{
  width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(135deg,#7f9bff,#5b7cfa);color:#fff;font-size:12px;
  display:grid;place-items:center;box-shadow:0 4px 10px rgba(91,124,250,.28);
}
.play:hover{filter:brightness(1.05)}
.tick{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}

/* ---------- lists / tables ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{
  text-align:left;padding:8px 10px;font-size:11.5px;color:var(--muted);font-weight:600;
  border-bottom:1px solid var(--line);background:#fbfcff;white-space:nowrap;
}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.behind td{background:linear-gradient(90deg,#fdf0f0,#fff);}
.tbl tr.today td{background:#f6f9ff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.qitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.qitem + .qitem{margin-top:8px}
.qitem .stem{font-size:13.8px;white-space:pre-wrap;word-break:break-word}
.qitem .stem.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qitem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.qitem .ansline{margin-top:6px;font-size:12.5px;color:#256b52;background:var(--green-soft);border:1px solid #cfeddd;border-radius:8px;padding:6px 10px;white-space:pre-wrap}
.ansline{margin-top:6px;font-size:12.8px;color:#256b52;background:var(--green-soft);border:1px solid #cfeddd;border-radius:8px;padding:8px 11px;white-space:pre-wrap;word-break:break-word}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
/* 选择题选项 */
.opts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.opt{display:flex;gap:6px;font-size:13px;line-height:1.55;color:var(--ink2);word-break:break-word}
.opt b{flex:none;color:var(--ink);font-weight:600}
.opts.sm .opt{font-size:12.5px}
html[data-theme="dark"] .opt b{color:var(--ink)}
html[data-theme="dark"] .opt{color:#c2cbdb}

/* ---------- empty state ---------- */
.empty{
  text-align:center;padding:36px 20px;border:1px dashed #dbe3f2;border-radius:14px;
  background:linear-gradient(180deg,#fdfdff,#f8faff);color:var(--muted);
}
.empty .em{font-size:30px;display:block;margin-bottom:8px;opacity:.65}
.empty h3{color:var(--ink2);font-size:15px;margin-bottom:4px}
.empty p{font-size:12.5px}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(24,32,54,.42);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(18,26,48,.24);
  animation:pop .18s ease;overflow:hidden;
}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:.6}to{transform:none;opacity:1}}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line2)}
.modal-head h3{font-size:15.5px;flex:1}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fdfdff}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}

/* ---------- toast ---------- */
.toast-root{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:120;pointer-events:none;width:max-content;max-width:92vw;
}
.toast{
  background:#243049;color:#fff;border-radius:11px;padding:9px 16px;font-size:13px;
  box-shadow:0 12px 30px rgba(18,26,48,.28);animation:toastIn .2s ease;
  display:flex;align-items:center;gap:8px;
}
.toast.ok{background:#1f6f4f}
.toast.warn{background:#8a5a12}
.toast.err{background:#96383a}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}

/* ---------- 完成打勾提示 ---------- */
.done-pop{
  position:fixed;left:50%;top:44%;transform:translateX(-50%);z-index:130;pointer-events:none;
  display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #cfe9dd;
  border-radius:16px;padding:13px 20px;box-shadow:0 18px 44px rgba(31,124,83,.2);
  animation:doneIn .26s ease-out;
}
.done-pop .tick{
  width:34px;height:34px;flex:none;border-radius:50%;background:#2ba36b;color:#fff;
  display:grid;place-items:center;font-size:18px;line-height:1;
  animation:tickPop .5s cubic-bezier(.2,1.5,.5,1);
}
.done-pop .dtxt{font-size:14px;font-weight:600;color:var(--ink)}
.done-pop .dtxt small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-pop.out{opacity:0;transition:.28s ease}
@keyframes tickPop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes doneIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.lesson.just-done{animation:rowGlow 1s ease-out}
@keyframes rowGlow{0%{background:#e9f7ef;box-shadow:0 0 0 3px rgba(43,163,107,.16)}100%{background:transparent;box-shadow:none}}

/* ---------- misc ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv .k{color:var(--muted);font-size:12.5px}
.help{font-size:12px;color:var(--muted);line-height:1.6}
.code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;
  background:#f6f8fd;border:1px solid var(--line);border-radius:7px;padding:1px 6px;
}
.warnbox{
  border:1px solid #f2e0bc;background:var(--amber-soft);color:#7d5a15;
  border-radius:10px;padding:9px 12px;font-size:12.5px;
}
.okbox{border:1px solid #c8e9d9;background:var(--green-soft);color:#1f6b4b;border-radius:10px;padding:9px 12px;font-size:12.5px}
.errbox{border:1px solid #f6d5d5;background:var(--red-soft);color:#a23c3c;border-radius:10px;padding:9px 12px;font-size:12.5px}
.preview-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#f7f9ff;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.preview-rows{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:44vh;overflow:auto;padding-right:4px}
.preview-row{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--line2);border-radius:9px}
.preview-row .txt{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:64px;overflow:hidden}
.preview-row .opts{max-height:110px;overflow:auto}
.preview-row .flds{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.preview-row .flds input{padding:5px 8px;font-size:12px}
.rowsel{display:flex;gap:6px;align-items:center}
.grp-title{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px;margin-top:10px;padding:6px 8px;background:#f5f8ff;border-radius:8px}
.hidden{display:none !important}

/* 课程增删 / 链接识别 / 网盘导入 */
.del-mini{border:none;background:transparent;color:var(--muted);font-size:13px;line-height:1;padding:3px 6px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.rew-name{border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:11.5px;line-height:1;padding:3px 7px;border-radius:6px;cursor:pointer;flex:0 0 auto;margin-left:4px}
.rew-name:hover{background:var(--line2);color:var(--ink)}
.del-mini:hover{background:var(--red-soft);color:var(--red)}
.morebox{border:1px dashed var(--line);border-radius:10px;padding:7px 12px;background:#fbfcff}
.morebox summary{cursor:pointer;font-size:12.5px;color:var(--ink2);font-weight:600;list-style:none}
.morebox summary::-webkit-details-marker{display:none}
.morebox summary::before{content:'▸ ';color:var(--muted)}
.morebox[open] summary::before{content:'▾ '}
.morebox .form-grid{margin-top:10px}
.picks{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fdfdff}
.pick{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2);cursor:pointer;line-height:1.5}
.pick input[type=checkbox]{width:auto;flex:0 0 auto;margin-top:2px}
.pick .pn{color:var(--muted);flex:0 0 auto}
.linkbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.linkbtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.bulklist{max-height:46vh;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:6px;background:#fdfdff}
.bulkrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.bulkrow:hover{background:#f4f6fb}
.bulkrow input[type=checkbox]{width:auto;flex:0 0 auto;margin:0}
.bulkrow .bk-sub{flex:0 0 auto;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 6px;font-size:11.5px}
.bulkrow .bk-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.bulkrow .bk-ch{flex:0 0 auto;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11.5px}
.bulkrow .bk-time{flex:0 0 auto;color:var(--muted);font-size:11.5px;min-width:52px;text-align:right}

@media (max-width:860px){
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-2{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .bar-inner{padding:8px 12px;gap:10px}
  .nav{margin-left:0;width:100%;order:3}
  .nav button{padding:6px 9px;font-size:12.5px}
  .nav{gap:2px;justify-content:space-between}
  .save-state{display:none}
  .theme-btn .theme-name{display:none}
  .theme-btn{padding:6px}
  .view{padding:16px 12px 80px}
  .cols-4,.cols-3{grid-template-columns:1fr 1fr}
  .card{padding:14px;border-radius:14px}
  .hero-value{font-size:36px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .card,.grid,.form-grid,.field{min-width:0}
  .modal{max-height:94vh}
  .modal-body{padding:14px}
  .tbl{font-size:12.5px}
  .lesson .acts{gap:2px}
  .search{max-width:none}
  /* —— S6：手机手感与主屏细节 —— */
  .topbar{padding-top:env(safe-area-inset-top,0)}
  .bar-inner{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .view{padding-bottom:calc(80px + env(safe-area-inset-bottom,0))}
  .nav{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;min-height:34px;padding:7px 11px}
  .btn{min-height:38px}
  .btn.sm{min-height:32px}
  input,select,textarea{font-size:16px !important}   /* iOS 聚焦时不再自动放大 */
  .modal{max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0)}
  .toast-root{bottom:calc(70px + env(safe-area-inset-bottom,0))}
}
/* 手机端底部快捷条（桌面隐藏） */
.m-bar{display:none}
@media (max-width:640px){
  .m-bar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:110;gap:2px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));
    background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  html[data-theme="dark"] .m-bar{background:rgba(20,26,35,.96);border-top-color:#26303e}
  html[data-theme="warm"] .m-bar{background:rgba(251,245,233,.97);border-top-color:#e7ddcc}
  .m-bar .m-btn{
    flex:1;min-height:40px;border:0;background:transparent;color:var(--ink2);
    font-size:12.5px;border-radius:10px;cursor:pointer;
  }
  .m-bar .m-btn:active{background:var(--line2)}
  .m-bar .m-accent{color:var(--brand);font-weight:600;background:rgba(91,124,250,.1)}
  body{padding-bottom:64px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- 主题（柔和蓝 / 暗色 / 护眼暖色） ---------- */

html[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1319; --card:#171d26;
  --ink:#e9eef7; --ink2:#bcc6d6; --muted:#8794a8;
  --line:#27313f; --line2:#1e2632;
  --brand:#7d97ff; --brand2:#9cb0ff; --brand-soft:#1d2740;
  --teal:#3fc0ab; --teal-soft:#12302a;
  --amber:#e0ab48; --amber-soft:#2f2716;
  --red:#ef7d7d; --red-soft:#341f1f;
  --green:#49bb87; --green-soft:#142a20;
  --violet:#a58bff; --violet-soft:#241f38;

}
html[data-theme="warm"]{color-scheme:light;
  --bg:#f6f1e7; --card:#fffdf8;

  --brand:#a06a3c; --brand2:#c08a58; --brand-soft:#f7ece0;

  --amber:#b5852f; --amber-soft:#f8efd9;
  --red:#c4644f; --red-soft:#f9e8e2;
  --green:#4f8a63; --green-soft:#e8f2ea;
  --violet:#8a6fa8; --violet-soft:#f0e9f6;
  --shadow:0 10px 28px rgba(90,70,40,.09); --shadow-sm:0 2px 8px rgba(90,70,40,.07);
}
html[data-theme="dark"] body{
  background:
    radial-gradient(1200px 620px at 8% -12%, #1a2334 0%, rgba(26,35,52,0) 62%),
    radial-gradient(900px 520px at 102% -4%, #132a26 0%, rgba(19,42,38,0) 58%),
    var(--bg);
}

  background:
    radial-gradient(1200px 620px at 8% -12%, #f3e8d6 0%, rgba(243,232,214,0) 62%),

}
html[data-theme="dark"] .topbar{background:rgba(18,24,33,.86)}

html[data-theme="dark"] .hero{

}

}
html[data-theme="dark"] .tabbtn{background:#141a23;color:var(--ink)}
html[data-theme="warm"] .tabbtn{background:#fffdf8;color:var(--ink)}

/* 主题切换按钮 */
.theme-btn{width:auto;min-width:34px;padding:0 11px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}

</style>

<body>
<header class="topbar">
  <div class="bar-inner">
    <div class="brand">
      <div class="logo">法</div>
      <div>
        <strong id="appTitle" class="app-title" data-act="settings-open" title="点击修改名称 / 每日提醒">法硕备考工作台</strong>
        <small>非法本 · 在职</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="row" style="gap:10px;align-items:center">
      <button class="icon-btn theme-btn" id="themeBtn" data-act="theme-cycle" title="界面风格（点击切换）">
        <span class="dot"></span><span class="theme-name">柔和蓝</span>
      </button>
      <button class="icon-btn" data-act="settings-open" title="设置 / 每日提醒">⚙</button>
      <button class="pt-chip" id="ptChip" data-act="tab" data-tab="plan" title="打卡积分（点击查看计划页）">⭐ <b id="ptChipVal">0.0</b> 分</button>
      <div class="sync-state" id="syncState" data-act="sync-now" title="点击立即同步">本机模式</div>

    </div>
  </div>
</header>
<main class="view" id="view"></main>
<div id="modalRoot"></div>
<!-- 手机端底部快捷条：独立于桌面顶栏，始终提供兑换入口 -->
<div class="m-bar" id="mBar">
  <button class="m-btn" data-act="tab" data-tab="overview">总览</button>
  <button class="m-btn" data-act="tab" data-tab="plan">课表</button>
  <button class="m-btn" data-act="tab" data-tab="real">真题</button>
  <button class="m-btn m-accent" data-act="redeem-open">⭐ 兑换</button>
  <button class="m-btn" data-act="tab" data-tab="review">复习</button>
</div>
<div class="toast-root" id="toastRoot"></div>
<noscript><div class="view"><div class="card">这个应用需要启用 JavaScript。</div></div></noscript>
<script>
"use strict";
/* =========================================================
   数据层：本地存储 / 状态 / 纯计算
   ========================================================= */
const STORE_KEY = 'fashuo.workbench.v1';
/* 法硕（非法本）五科在前；后面是公共课/其它，便于把网盘里的英语课、政治课也归好类。
   （待补充：其它非法硕科目名称清单 —— 目前按需加「英语」「政治」两个） */
const FASHUO_SUBJECTS = ['刑法', '民法', '法理学', '宪法', '中国法制史'];
const EXTRA_SUBJECTS = ['英语', '政治'];
const SUBJECTS = FASHUO_SUBJECTS.concat(EXTRA_SUBJECTS);
const INTERVALS = [1, 2, 4, 7, 15, 30];          // 艾宾浩斯复习间隔（天）
const KIND_LABEL = { real: '真题' };
const TAB_LABEL = {
  overview: '总览', courses: '课程',
  real: '真题', plan: '计划', review: '复习提醒'
};
const EX_PER_CHAPTER = 10;   // 每学完一章建议习题量
const RE_PER_CHAPTER = 5;    // 每学完一章建议真题量
const EX_DAILY_CAP = 30;
const RE_DAILY_CAP = 15;

/* ---------- UI 风格 ---------- */
const THEMES = [
  { id: 'soft', name: '柔和蓝', desc: '默认：浅蓝底 + 白色卡片', color: '#5b7cfa' },
  { id: 'warm', name: '护眼暖色', desc: '米黄底，长时间看不刺眼', color: '#a06a3c' },
  { id: 'dark', name: '暗色', desc: '夜间使用，深底浅字', color: '#7d97ff' }
];
const THEME_IDS = THEMES.map(function (t) { return t.id; });
/* OCR 语言档位：tesseract.js 会为每种语言单独下载 traineddata（首次联网，之后进 IndexedDB 缓存） */

/* 把主题写到 <html data-theme>，同时更新浏览器地址栏颜色 */
function applyTheme() {
  const id = currentTheme();
  const root = document.documentElement;
  if (id === 'soft') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', id);
  const info = THEMES.filter(function (t) { return t.id === id; })[0] || THEMES[0];
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', id === 'dark' ? '#0f1319' : (id === 'warm' ? '#f6f1e7' : '#f4f6fb'));

  if (btn) {

function setTheme(id, silent) {

  if (!silent) {
    const info = THEMES.filter(function (t) { return t.id === next; })[0];
    toast('界面风格：' + info.name, 'ok');
  }
  return next;
}

/* ---------- 小工具 ---------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function uid(p) { return (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
function ratio(a, b) { return b > 0 ? a / b : 0; }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseYMD(s) {
  if (!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function ymdOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(s, n) {
  const d = parseYMD(s);
  if (!d) return s;
  d.setDate(d.getDate() + n);
  return ymdOf(d);
}
function diffDays(a, b) {          // b - a，按自然日
  const A = parseYMD(a), B = parseYMD(b);
  if (!A || !B) return 0;
  return Math.round((B.getTime() - A.getTime()) / 86400000);
}
function weekdayCN(s) {
  const d = parseYMD(s);
  return d ? '周' + '日一二三四五六'[d.getDay()] : '';
}
function fmtDateCN(s) {
  const d = parseYMD(s);
  if (!d) return s || '';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function nowHM() {
  const d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + ' 秒';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (h <= 0) return m + ' 分钟';
  if (m === 0) return h + ' 小时';
  return h + ' 小时 ' + m + ' 分';
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? (h + ':' + pad2(m) + ':' + pad2(s)) : (m + ':' + pad2(s));
}

/* ---------- 默认状态与持久化 ---------- */
function defaultState() {

    questions: { real: [] },

    pdfs: [],
    pdfProg: {},
    restDays: {},

let state = defaultState();

function coerceState(raw) {
  const s = defaultState();
  if (!raw || typeof raw !== 'object') return s;
  if (Array.isArray(raw.courses)) s.courses = raw.courses.filter(c => c && typeof c === 'object');
  if (raw.questions && typeof raw.questions === 'object') {
    /* 习题库已移除：只保留真题（旧的 exercise 数据不再载入） */
    if (Array.isArray(raw.questions.real)) s.questions.real = raw.questions.real.filter(Boolean).map(function (q) {
      q.year = Number(q.year) || 0;
      q.name = String(q.name || q.stem || '').slice(0, 80);
      q.reviewTarget = Math.max(1, Math.min(50, Number(q.reviewTarget) || 1));
      q.reviewDone = Math.max(0, Math.min(50, Number(q.reviewDone) || 0));
      return q;
    });
  }
  if (raw.restDays && typeof raw.restDays === 'object') {
    Object.keys(raw.restDays).forEach(function (k) { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && raw.restDays[k]) s.restDays[k] = true; });
  }
  if (raw.realPlan && Array.isArray(raw.realPlan.ids)) {
    s.realPlan = { ids: raw.realPlan.ids.filter(Boolean), confirmedAt: Number(raw.realPlan.confirmedAt) || 0 };
  }
  if (Array.isArray(raw.wrong)) s.wrong = raw.wrong.filter(Boolean);
  if (Array.isArray(raw.pdfs)) {
    s.pdfs = raw.pdfs.filter(function (p) { return p && p.id && p.pageCount > 0; }).slice(0, 20).map(function (p) {
      return {
        id: String(p.id), name: String(p.name || 'PDF'), fileName: String(p.fileName || p.name || ''), pageCount: Number(p.pageCount) || 0,
        subject: String(p.subject || '未分类'),
        chapters: Array.isArray(p.chapters) ? p.chapters.slice(0, 120) : [],
        pages: Array.isArray(p.pages) ? p.pages.slice(0, 400) : [],
        manual: !!p.manual,
        ocr: !!p.ocr,
        addedAt: Number(p.addedAt) || 0
      };
    });
  }
  if (raw.pdfProg && typeof raw.pdfProg === 'object') {
    Object.keys(raw.pdfProg).forEach(function (k) {
      const v = raw.pdfProg[k] || {};
      s.pdfProg[k] = { pct: clamp(Math.round(Number(v.pct) || 0), 0, 100), ts: Number(v.ts) || 0 };
    });
  }
  if (raw.plan && typeof raw.plan === 'object') {
    s.plan.examDate = typeof raw.plan.examDate === 'string' ? raw.plan.examDate : '';
    s.plan.dailyMinutes = Number(raw.plan.dailyMinutes) > 0 ? Number(raw.plan.dailyMinutes) : 120;
    s.plan.sectionMinutes = Number(raw.plan.sectionMinutes) > 0 ? Number(raw.plan.sectionMinutes) : 25;
    const rr = Number(raw.plan.reviewRounds);
    s.plan.reviewRounds = rr >= 1 && rr <= 6 ? Math.round(rr) : 3;
    const fb = Number(raw.plan.fallbackMinutes);
    s.plan.fallbackMinutes = fb >= 10 && fb <= 180 ? Math.round(fb) : 45;
  }
  s.courses = s.courses.map(c => {
    const n = Number(c.reviewed);
    c.reviewed = n >= 0 ? Math.min(6, Math.round(n)) : 0;
    return c;
  });
  if (raw.daily && typeof raw.daily === 'object') s.daily = raw.daily;
  /* 积分快照：只认已结算的记录，total 一律由记录重算，避免手改/旧版脏数据 */
  s.points = { total: 0, log: {}, savedAt: 0, redeem: { spent: 0, log: {}, rules: { ratio: 0.2, dailyMax: 20, refundable: true } } };
  if (raw.points && typeof raw.points === 'object' && raw.points.log && typeof raw.points.log === 'object') {
    Object.keys(raw.points.log).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const v = raw.points.log[k] || {};
      const pts = Math.round((Number(v.pts) || 0) * 10) / 10;
      if (pts <= 0) return;
      s.points.log[k] = {
        planned: k,
        doneOn: /^\d{4}-\d{2}-\d{2}$/.test(String(v.doneOn || '')) ? String(v.doneOn) : k,
        delay: Math.round(Number(v.delay) || 0),
        pts: pts,
        settledAt: Number(v.settledAt) || 0
      };
    });
    s.points.savedAt = Number(raw.points.savedAt) || 0;
  }
  s.points.total = Math.round(Object.keys(s.points.log).reduce(function (a, k) { return a + s.points.log[k].pts; }, 0) * 10) / 10;
  /* 兑换账本：与 log 分离，只增不改的 log 不受影响 */
  if (raw.points && raw.points.redeem && typeof raw.points.redeem === 'object') {
    const rd = raw.points.redeem;
    let spent = 0;
    const log = {};
    if (rd.log && typeof rd.log === 'object') {
      Object.keys(rd.log).forEach(function (k) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
        const v = rd.log[k] || {};
        const cost = Math.round((Number(v.cost) || 0) * 10) / 10;
        if (cost <= 0) return;
        log[k] = { cost: cost, at: Number(v.at) || 0 };
        spent += cost;
      });
    }
    s.points.redeem = {
      spent: Math.round(spent * 10) / 10,
      log: log,
      rules: Object.assign({ ratio: 0.2, dailyMax: 20, refundable: true }, (rd.rules && typeof rd.rules === 'object') ? rd.rules : {})
    };
  }
  if (raw.pinned && typeof raw.pinned === 'object') s.pinned = raw.pinned;
  if (raw.open && typeof raw.open === 'object') s.open = raw.open;
  if (raw.ui && typeof raw.ui === 'object') {
    if (raw.ui.tab && TAB_LABEL[raw.ui.tab]) s.ui.tab = raw.ui.tab;
    if (raw.ui.bank && typeof raw.ui.bank === 'object') {
      const b = raw.ui.bank.real;
      if (b && typeof b === 'object') {
        s.ui.bank.real = {
          q: typeof b.q === 'string' ? b.q : '',
          subject: typeof b.subject === 'string' ? b.subject : '',
          status: typeof b.status === 'string' ? b.status : '',
          year: typeof b.year === 'string' ? b.year : ''
        };
      }
    }
    if (raw.ui.overviewOpen && typeof raw.ui.overviewOpen === 'object') s.ui.overviewOpen = raw.ui.overviewOpen;
  }
  if (raw.meta && typeof raw.meta === 'object') {
    s.meta.createdAt = raw.meta.createdAt || Date.now();
    s.meta.lastSavedAt = raw.meta.lastSavedAt || 0;
    s.meta.title = String(raw.meta.title || '法硕备考工作台').slice(0, 24);
    s.meta.theme = THEME_IDS.indexOf(String(raw.meta.theme || '')) >= 0 ? String(raw.meta.theme) : 'soft';
    s.meta.pdfDir = String(raw.meta.pdfDir || '').slice(0, 300);
    s.meta.pdfScanRecursive = !!raw.meta.pdfScanRecursive;
    s.meta.ocrLang = OCR_LANGS.some(function (l) { return l.id === String(raw.meta.ocrLang || ''); }) ? String(raw.meta.ocrLang) : 'chi_sim';
    const rm = raw.meta.reminder && typeof raw.meta.reminder === 'object' ? raw.meta.reminder : {};
    s.meta.reminder = {
      enabled: rm.enabled !== false,
      time: /^\d{1,2}:\d{2}$/.test(String(rm.time || '')) ? String(rm.time) : '20:00',
      serverChan: String(rm.serverChan || ''),
      wecom: String(rm.wecom || ''),
      ntfyServer: String(rm.ntfyServer || 'https://ntfy.sh'),
      ntfyTopic: String(rm.ntfyTopic || ''),
      lastSent: String(rm.lastSent || ''),
      ep: rm.ep && typeof rm.ep === 'object' ? rm.ep : null
    };
  }
  /* 修补字段与脏引用 */
  s.courses.forEach(function (c) {
    c.id = c.id || uid('c');
    c.subject = String(c.subject || '未分类');
    c.chapter = String(c.chapter || '未分章');
    c.section = String(c.section || '未命名小节');
    c.original = String(c.original || c.section);
    c.name = String(c.name || c.section);
    c.video = String(c.video || '');
    c.seconds = Number(c.seconds) || 0;
    const mins = Number(c.minutes);
    c.minutes = mins > 0 ? clamp(Math.round(mins), 1, 600) : 0;
    c.minutesSource = ['bili', 'file', 'manual', 'text'].indexOf(String(c.minutesSource)) >= 0
      ? String(c.minutesSource) : (c.minutes ? 'manual' : '');
    c.done = !!c.done;
  });
  ['real'].forEach(function (k) {
    s.questions[k].forEach(function (q) {
      q.id = q.id || uid('q');
      q.subject = String(q.subject || '未分类');
      q.chapter = String(q.chapter || '未分章');
      q.section = String(q.section || '');
      q.stem = String(q.stem || '');
      q.answer = String(q.answer || '');
      q.name = String(q.name || q.stem.slice(0, 30) || '真题');
      q.year = Math.round(Number(q.year) || 0);
      q.reviewTarget = Math.max(1, Math.min(50, Number(q.reviewTarget) || 1));
      q.reviewDone = Math.max(0, Math.min(50, Number(q.reviewDone) || 0));
      q.done = q.reviewDone >= q.reviewTarget;
      q.wrong = !!q.wrong;
    });
  });
  s.wrong = s.wrong.filter(function (w) {
    if (!w || !w.qid) return false;
    if (w.kind !== 'real') return false;
    const arr = s.questions[w.kind];
    if (!Array.isArray(arr)) return false;
    return arr.some(q => q.id === w.qid);
  });
  s.wrong.forEach(function (w) {
    w.stage = clamp(Number(w.stage) || 0, 0, INTERVALS.length - 1);
    w.count = Number(w.count) || 0;
    w.dueDate = w.dueDate || addDays(todayStr(), INTERVALS[w.stage]);
  });
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    return coerceState(JSON.parse(raw));
  } catch (e) {
    console.warn('读取本地数据失败', e);
    return defaultState();
  }
}

let saveTimer = null;
function save(now) {
  if (now) { flushSave(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 160);
}
function flushSave() {
  clearTimeout(saveTimer);
  try {
    state.meta.lastSavedAt = Date.now();
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    const el = document.getElementById('saveState');
    if (el) {
      el.textContent = '已保存 ' + nowHM();
      el.classList.add('flash');
      clearTimeout(flushSave._t);
      flushSave._t = setTimeout(function () { el.classList.remove('flash'); }, 900);
    }
  } catch (e) {
    toast('保存失败：本地存储写入被拒绝或空间已满', 'err');
  }
  if (SYNC_ON && !applyingRemote) { queueSync(); queueSyncStatusRefresh(); }
}

function rk(kind, id) { return kind + '|' + id; }

function courseData(c) {

    name: p.name || 'PDF', fileName: p.fileName || p.name || '', pageCount: Number(p.pageCount) || 0, subject: p.subject || '未分类',
    chapters: (p.chapters || []).slice(0, 120),

  };

/* 把当前 state 展平成记录；与上次同步的签名不同 → ts 取现在（待推送） */
function collectRecords() {
  const m = loadSyncMeta();
  const now = Date.now();
  const out = [];
  const seen = {};
  function put(kind, id, data) {
    const key = rk(kind, id);
    seen[key] = 1;
    const sig = kind + '|' + id + '|' + JSON.stringify(data);
    const ts = (m.sigs[key] === sig && m.ts[key]) ? m.ts[key] : now;
    out.push({ key: key, kind: kind, id: id, data: data, ts: ts, deleted: false, sig: sig });
  }
  state.courses.forEach(function (c) { put('course', c.id, courseData(c)); });
  ['real'].forEach(function (k) {
    (state.questions[k] || []).forEach(function (q) { put('q:' + k, q.id, questionData(q)); });
  });
  state.wrong.forEach(function (w) { put('wrong', w.kind + ':' + w.qid, wrongData(w)); });
  (state.pdfs || []).forEach(function (p) { put('pdf', p.id, pdfData(p)); });
  Object.keys(state.pdfProg || {}).forEach(function (k) { put('pdfprog', k, state.pdfProg[k]); });
  put('plan', 'plan', planData(state.plan));
  put('points', 'points', pointsData());
  put('meta', 'meta', metaData(state.meta));
  Object.keys(state.daily || {}).forEach(function (d) {
    const v = state.daily[d] || {};
    /* 全零的空记录不推，避免渲染时创建的空 daily 造成「待同步」抖动 */
    if (!Number(v.coursesDone) && !Number(v.seconds) && !m.sigs[rk('daily', d)]) return;
    put('daily', d, v);
  });
  /* 之前同步过、现在本地没了 → 墓碑 */
  Object.keys(m.sigs).forEach(function (key) {
    if (seen[key]) return;
    const cut = key.indexOf('|');
    out.push({ key: key, kind: key.slice(0, cut), id: key.slice(cut + 1), data: null, ts: now, deleted: true, sig: '' });
  });
  return { records: out, meta: m };
}

function upsertCourse(id, data) {
  const idx = state.courses.findIndex(function (c) { return c.id === id; });
  const rec = Object.assign({ id: id }, data);
  if (idx >= 0) state.courses[idx] = Object.assign({}, state.courses[idx], rec);
  else state.courses.push(rec);
}
function upsertQuestion(kind, id, data) {
  const bank = state.questions[kind];
  if (!Array.isArray(bank)) return;
  const idx = bank.findIndex(function (q) { return q.id === id; });
  const rec = Object.assign({ id: id }, data);
  if (idx >= 0) bank[idx] = Object.assign({}, bank[idx], rec);
  else bank.push(rec);
}
function upsertWrong(kind, qid, data) {
  const idx = state.wrong.findIndex(function (w) { return w.kind === kind && w.qid === qid; });
  const rec = Object.assign({ kind: kind, qid: qid }, data);
  if (idx >= 0) state.wrong[idx] = Object.assign({}, state.wrong[idx], rec);
  else state.wrong.push(rec);
}

/* 应用服务器返回的记录；本地未推送的改动优先保留 */
function applyRemote(records, m) {
  let changed = 0;
  (records || []).forEach(function (r) {
    if (!r || !r.kind || !r.id) return;
    const key = rk(r.kind, r.id);
    const localSig = m.sigs[key];
    if (localSig) {
      const localCur = collectOne(key);
      if (localCur == null) {
        /* 本地已删除且尚未推送 → 保持删除，等推送墓碑 */
        return;
      }
      if (localCur.sig !== localSig) return;      /* 本地有未同步修改，保留本地 */
    }
    if (r.deleted) {
      removeLocal(r.kind, r.id);
      changed++;
      return;
    }
    if (r.kind === 'course') { upsertCourse(r.id, r.data || {}); changed++; }
    else if (r.kind === 'q:exercise' || r.kind === 'q:real') { upsertQuestion(r.kind.slice(2), r.id, r.data || {}); changed++; }
    else if (r.kind === 'wrong') { upsertWrong(r.data.kind, r.data.qid, r.data || {}); changed++; }
    else if (r.kind === 'plan') { state.plan = Object.assign({}, state.plan, r.data || {}); changed++; }
    else if (r.kind === 'points') {
      /* 快照按计划日合并：同一计划日取 settledAt 较新的；总额重算 */
      const remote = (r.data && r.data.log) || {};
      state.points = state.points || { total: 0, log: {}, savedAt: 0 };
      Object.keys(remote).forEach(function (k) {
        const cur = state.points.log[k];
        const pick = (!cur || (Number(remote[k].settledAt) || 0) > (Number(cur.settledAt) || 0)) ? remote[k] : cur;
        state.points.log[k] = { planned: k, doneOn: pick.doneOn, delay: pick.delay, pts: pick.pts, settledAt: Number(pick.settledAt) || 0 };
      });
      state.points.total = Math.round(Object.keys(state.points.log).reduce(function (a, k) { return a + state.points.log[k].pts; }, 0) * 10) / 10;
      state.points.savedAt = Math.max(Number(state.points.savedAt) || 0, Number(r.data && r.data.savedAt) || 0);
      changed++;
    }
    else if (r.kind === 'meta') { state.meta = Object.assign({}, state.meta, r.data || {}); applyTitle(); applyTheme(); changed++; }
    else if (r.kind === 'daily') { state.daily[r.id] = r.data || {}; changed++; }
    else if (r.kind === 'pdf') {
      state.pdfs = state.pdfs || [];
      const idx = state.pdfs.findIndex(function (x) { return x.id === r.id; });
      const rec = Object.assign({ id: r.id }, r.data || {});
      if (idx >= 0) state.pdfs[idx] = rec; else state.pdfs.push(rec);
      changed++;
    }
    else if (r.kind === 'pdfprog') {
      state.pdfProg = state.pdfProg || {};
      state.pdfProg[r.id] = r.data || { pct: 0 };
      changed++;
    }
  });
  return changed;
}

function collectOne(key) {
  const cut = key.indexOf('|');
  const kind = key.slice(0, cut), id = key.slice(cut + 1);
  if (kind === 'course') {
    const c = state.courses.find(function (x) { return x.id === id; });
    if (!c) return null;
    const data = courseData(c);
    return { data: data, sig: kind + '|' + id + '|' + JSON.stringify(data) };
  }
  if (kind === 'q:exercise' || kind === 'q:real') {
    const q = (state.questions[kind.slice(2)] || []).find(function (x) { return x.id === id; });
    if (!q) return null;
    const data = questionData(q);
    return { data: data, sig: kind + '|' + id + '|' + JSON.stringify(data) };
  }
  if (kind === 'wrong') {
    const w = state.wrong.find(function (x) { return x.kind + ':' + x.qid === id; });
    if (!w) return null;
    const data = wrongData(w);
    return { data: data, sig: kind + '|' + id + '|' + JSON.stringify(data) };
  }
  if (kind === 'plan') { const d = planData(state.plan); return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) }; }
  if (kind === 'points') { const d = pointsData(); return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) }; }
  if (kind === 'meta') { const d = metaData(state.meta); return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) }; }
  if (kind === 'daily') {
    const d = state.daily[id];
    if (!d) return null;
    return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) };
  }
  if (kind === 'pdf') {
    const p = (state.pdfs || []).find(function (x) { return x.id === id; });
    if (!p) return null;
    const d = pdfData(p);
    return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) };
  }
  if (kind === 'pdfprog') {
    const d = (state.pdfProg || {})[id];
    if (!d) return null;
    return { data: d, sig: kind + '|' + id + '|' + JSON.stringify(d) };
  }
  return null;
}

function removeLocal(kind, id) {
  if (kind === 'course') state.courses = state.courses.filter(function (c) { return c.id !== id; });
  else if (kind === 'q:exercise') state.questions.exercise = state.questions.exercise.filter(function (q) { return q.id !== id; });
  else if (kind === 'q:real') state.questions.real = state.questions.real.filter(function (q) { return q.id !== id; });
  else if (kind === 'wrong') state.wrong = state.wrong.filter(function (w) { return w.kind + ':' + w.qid !== id; });
  else if (kind === 'daily') delete state.daily[id];
  else if (kind === 'pdf') state.pdfs = (state.pdfs || []).filter(function (p) { return p.id !== id; });
  else if (kind === 'pdfprog') delete (state.pdfProg || {})[id];
}

function setSyncLabel(text, cls) {
  const el = document.getElementById('syncState');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-state ' + (cls || '');
}
function syncStatusText() {
  const m = loadSyncMeta();
  const col = collectRecords();
  let pending = 0;
  col.records.forEach(function (r) {
    if (r.deleted || !m.sigs[r.key] || m.sigs[r.key] !== r.sig) pending++;
  });
  const mm = m.lastAt ? (' · ' + new Date(m.lastAt).toTimeString().slice(0, 5)) : '';
  return { pending: pending, meta: m, col: col, text: '已同步' + mm };
}

function queueSync(delay) {
  if (!SYNC_ON || !syncServer || applyingRemote) return;   /* 无电脑/静态托管：不排队，数据只写本机 */
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { syncNow(false); }, delay || 2500);
}

async function syncNow(manual) {
  if (!SYNC_ON || !syncServer || syncing) return;
  syncing = true;
  setSyncLabel('同步中…', 'busy');
  try {
    const m = loadSyncMeta();
    const col = collectRecords();
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    let res;
    try {
      const r = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify({ device: deviceId(), clientRev: m.rev, records: col.records.map(function (x) { return { kind: x.kind, id: x.id, data: x.data, ts: x.ts, deleted: x.deleted }; }) }),
        signal: ctrl ? ctrl.signal : undefined
      });
      res = await r.json();
    } finally { clearTimeout(timer); }
    if (!res || !res.ok) throw new Error((res && res.msg) || '同步失败');

    applyingRemote = true;
    const changed = applyRemote(res.records, m);
    if (changed) save(true);
    applyingRemote = false;

    const next = loadSyncMeta();
    next.rev = Number(res.rev) || 0;
    next.lastAt = Date.now();
    next.lastErr = '';
    const returned = {};
    (res.records || []).forEach(function (r) { returned[rk(r.kind, r.id)] = r.ts; });
    col.records.forEach(function (r) {
      if (r.deleted) { delete next.sigs[r.key]; delete next.ts[r.key]; return; }
      next.sigs[r.key] = r.sig;
      next.ts[r.key] = Number(returned[r.key]) || r.ts;
    });
    Object.keys(returned).forEach(function (k) {
      if (next.ts[k] == null) next.ts[k] = returned[k];
      if (next.sigs[k] == null) {
        const one = collectOne(k);
        if (one) next.sigs[k] = one.sig;
      }
    });
    saveSyncMeta(next);

    if (changed && !document.querySelector('.overlay')) render();
    setSyncLabel('已同步', 'ok');
    if (manual) toast('已同步 ' + changed + ' 项改动', 'ok');
    queueSyncStatusRefresh();
  } catch (e) {
    const m = loadSyncMeta();
    m.lastErr = String((e && e.message) || e);
    saveSyncMeta(m);
    setSyncLabel('离线 · 本机保存', 'off');
    if (manual) toast('连不上电脑上的助手，已保存在本机', 'warn');
  } finally {
    syncing = false;
  }
}

let syncLabelTimer = null;
function queueSyncStatusRefresh() {
  clearTimeout(syncLabelTimer);
  syncLabelTimer = setTimeout(refreshSyncLabel, 900);
}
let syncServer = true;   /* 有电脑助手/云接口时 true；静态托管（纯本机）时置 false */
function refreshSyncLabel() {
  if (!SYNC_ON) { setSyncLabel('本机模式', 'off'); return; }
  if (!syncServer) { setSyncLabel('本机保存 · 无同步', 'off'); return; }
  if (syncing) return;
  if (navigator.onLine === false) { setSyncLabel('离线 · 本机保存', 'off'); return; }
  const st = syncStatusText();
  if (st.meta.lastErr) setSyncLabel('离线 · 本机保存', 'off');
  else if (st.pending > 0) setSyncLabel(st.pending + ' 项待同步', 'pending');
  else if (st.meta.lastAt) setSyncLabel(st.text, 'ok');
  else setSyncLabel('等待同步', 'pending');
}
let swRegistration = null;

/* 首次打开：拉一次全量（记录级合并），然后正常推送 */
async function syncBootstrap() {
  if (!SYNC_ON) return;
  try {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
    let res;
    try {
      const r = await fetch('/api/state', { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
      res = await r.json();
    } finally { clearTimeout(timer); }
    if (!res || !res.ok) throw new Error('no state');
    const m = loadSyncMeta();
    applyingRemote = true;
    const changed = applyRemote(res.records, m);
    if (changed) save(true);
    applyingRemote = false;
    syncNow(false);
  } catch (e) {
    /* 拉不到 /api/state 说明是静态托管：本机保存即可，不再报错 */
    syncServer = false;
    refreshSyncLabel();
  }
}

        if (no) no.addEventListener('click', function () { finish(false); });

/* ---------- 统计 ---------- */
function overallStats() {
  const c = state.courses;
  const re = bankOf('real');
  const vTotal = c.length, vDone = c.filter(x => x.done).length;
  /* 真题按「计划复习次数」计算完成度：Σ已完成 / Σ计划次数 */
  const rTarget = re.reduce(function (a, q) { return a + (Number(q.reviewTarget) || 1); }, 0);
  const rDone = re.reduce(function (a, q) { return a + Math.min(Number(q.reviewTarget) || 1, Number(q.reviewDone) || 0); }, 0);
  const overall = (ratio(vDone, vTotal) + ratio(rDone, rTarget)) / 2;
  const seconds = c.reduce(function (a, x) { return a + (Number(x.seconds) || 0); }, 0);
  return {
    vTotal: vTotal, vDone: vDone,
    rTotal: re.length, rDone: re.filter(q => Number(q.reviewDone) >= (Number(q.reviewTarget) || 1)).length,
    rTarget: rTarget, rDoneCount: rDone,
    overall: overall, seconds: seconds
  };
}
function subjectStats() {
  const out = [];
  subjectList().forEach(function (s) {
    const cs = state.courses.filter(c => c.subject === s);
    const re = bankOf('real').filter(q => q.subject === s);

    const vDone = cs.filter(c => c.done).length;
    const rTarget = re.reduce(function (a, q) { return a + (Number(q.reviewTarget) || 1); }, 0);
    const rDone = re.reduce(function (a, q) { return a + Math.min(Number(q.reviewTarget) || 1, Number(q.reviewDone) || 0); }, 0);
    out.push({

      vPct: pct(vDone, cs.length), rPct: pct(rDone, rTarget)
    });
  });
  return out;
}
function learnedChapters() {

/* ---------- 计划 ---------- */
/* 严格轮次门禁：第 r 轮全部完成之前，任何课都不能进入第 r+1 轮。 */
function roundGate() {
  const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
  const doneCourses = state.courses.filter(function (c) { return c.done; });
  const empty = { rounds: rounds, round: 0, remaining: 0, allowed: 0, doneCourses: 0, lockedRounds: rounds, note: '' };
  if (!doneCourses.length) return Object.assign({}, empty, { note: '先标记课程「已完成」，复习轮次才会开始' });
  const reviewedOf = function (c) { return Math.max(0, Number(c.reviewed) || 0); };
  let round = rounds;
  for (let r = 1; r <= rounds; r++) {
    if (doneCourses.some(function (c) { return reviewedOf(c) < r; })) { round = r; break; }
  }
  const remaining = doneCourses.filter(function (c) { return reviewedOf(c) < round; }).length;
  const minDone = Math.min.apply(null, doneCourses.map(reviewedOf));
  const allowed = Math.min(rounds, minDone + 1);
  return {
    rounds: rounds, round: round, remaining: remaining, allowed: allowed,
    doneCourses: doneCourses.length, lockedRounds: Math.max(0, rounds - allowed),
    note: remaining ? ('第 ' + round + ' 轮还差 ' + remaining + ' 节') : ''
  };
}

/* 时长取值链：课程自填/解析值 → 未知按「兜底分钟数」（默认 45）。 */
function courseMinutes(c) {
  const m = Number(c && c.minutes);
  if (m > 0) return { min: clamp(Math.round(m), 1, 600), src: (c.minutesSource || 'manual'), estimated: false };
  const fb = clamp(Math.round(Number(state.plan.fallbackMinutes) || 45), 10, 180);
  return { min: fb, src: 'default', estimated: true };
}
function minutesLabel(c) {
  const cm = courseMinutes(c);
  return cm.estimated ? (cm.min + ' 分钟（估算）') : (cm.min + ' 分钟');
}

/* 剩余任务 = 未完成课程的学习任务 + 各轮未完成复习任务。 */
function taskList() {
  const learn = state.courses.filter(function (c) { return !c.done; })
    .map(function (c) { return { cid: c.id, subject: c.subject, kind: 'learn', round: 0 }; });
  const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
  const review = [];
  for (let r = 1; r <= rounds; r++) {
    state.courses.forEach(function (c) {
      if (!c.done) return;
      if ((Number(c.reviewed) || 0) < r) review.push({ cid: c.id, subject: c.subject, kind: 'review', round: r });
    });
  }
  return { learn: learn, review: review, total: learn.length + review.length };
}
/* 同科目不相邻：贪心——每步从「剩余最多且与上一项不同科目」的组里取 */
function interleaveBySubject(tasks) {
  const groups = new Map();
  tasks.forEach(function (t) {
    if (!groups.has(t.subject)) groups.set(t.subject, []);
    groups.get(t.subject).push(t);
  });
  const out = [];
  let last = '';
  for (let guard = 0; guard < 5000 && out.length < tasks.length; guard++) {
    let best = '';
    groups.forEach(function (g, k) {
      if (!g.length) return;
      if (k === last) return;
      if (!best || g.length > groups.get(best).length) best = k;
    });
    if (!best) {
      /* 只剩同一科目：取剩余最多者（无法再避免相邻） */

/* 按天打卡积分：按时 1 分 / 超前 2 分 / 逾期 0.8 − 0.1×(拖−1)，超 3 天后每天再 −0.3，最低 0 */

    if (state.restDays && state.restDays[r.date]) return;
    req += r.tasks.length;
    if (!r.tasks.length) return;
    let doneOn = null;
    for (let i = 0; i < dates.length; i++) {
      if (cumByDate[dates[i]] >= req) { doneOn = dates[i]; break; }

    if (!doneOn) { pending += r.tasks.length; return; }

/* 按天切分任务队列；today 用实际完成数，其余天按目标推进。

function scheduleRows(info) {
  info = info || planInfo();
  const rows = [];
  if (!info.exam) return rows;
  const today = todayStr();
  if (diffDays(today, info.exam) < 0) return rows;
  let queue = planQueue();
  const fb = info.fallbackMinutes;
  for (let i = 0; i < 30; i++) {
    const d = addDays(today, i);
    const left = diffDays(d, info.exam);
    if (left <= 0) break;
    const isToday = i === 0;
    const isRest = !!(state.restDays && state.restDays[d]);
    const target = isRest ? 0 : (queue.length ? Math.max(1, Math.ceil(queue.length / Math.max(1, left))) : 0);
    const take = isRest ? [] : queue.slice(0, target);
    const actual = tasksDoneOn(d);
    const subjects = Array.from(new Set(take.map(function (t) { return t.subject; })));
    const estMinutes = take.reduce(function (a, t) {
      const c = findCourse(t.cid);
      return a + (c ? courseMinutes(c).min : fb);
    }, 0);
    const status = isRest ? 'ok' : (isToday ? (target === 0 || actual >= target ? 'ok' : 'behind') : 'future');

    const prev = rows.length ? rows[rows.length - 1] : null;
    /* 严格口径：当天只有 1 科时，若与前一天同为该科目，则两天都算「单科日（连续）」 */
    const sameAsPrev = !!(single && prev && prev.singleSubjectDay && prev.subjects[0] === subjects[0]);

      minutes: estMinutes, subjects: subjects, singleSubjectDay: single,
      sameAsPrev: sameAsPrev, streak: sameAsPrev ? (prev.streak || 1) + 1 : (single ? 1 : 0),
      left: diffDays(d, info.exam),

    queue = queue.slice(Math.min(queue.length, target));
  }

  rows.forEach(function (r, i) {

}

/* 总览：真题计划总进度（确认后显示） */
function realProgressCard() {
  const ids = state.realPlan.ids || [];
  if (!ids.length || !Number(state.realPlan.confirmedAt)) return '';
  const qs = ids.map(function (id) { return findQuestion('real', id); }).filter(Boolean);
  if (!qs.length) return '';
  const target = qs.reduce(function (a, q) { return a + (Number(q.reviewTarget) || 1); }, 0);
  const done = qs.reduce(function (a, q) { return a + Math.min(Number(q.reviewTarget) || 1, Number(q.reviewDone) || 0); }, 0);
  const p = pct(done, target);
  return '<div class="card"><div class="section-title"><h2>真题计划进度</h2><span class="spacer"></span>' +
      '<span class="small muted">' + qs.length + ' 份 · 复习 ' + done + '/' + target + ' 次</span>' +
      '<button class="btn sm ghost" data-act="tab" data-tab="plan">调整计划 →</button></div>' +
    '<div class="bar"><i style="width:' + p + '%"></i></div>' +
    '<div class="stack" style="margin-top:10px">' + qs.map(function (q) {
      const t = Number(q.reviewTarget) || 1, d = Number(q.reviewDone) || 0;
      return '<div class="rvline"><span class="rvlab">' + esc((q.name || q.stem.slice(0, 12)).slice(0, 16)) + '</span>' +
        '<div class="bar thin ' + (d >= t ? 'green' : '') + '"><i style="width:' + pct(d, t) + '%"></i></div>' +
        '<span class="rvpct">' + d + '/' + t + '</span></div>';

}

/* ---------- 课程 ---------- */
function courseTree() {
  const map = new Map();
  state.courses.forEach(function (c) {
    if (!map.has(c.subject)) map.set(c.subject, new Map());
    const cm = map.get(c.subject);
    if (!cm.has(c.chapter)) cm.set(c.chapter, []);
    cm.get(c.chapter).push(c);
  });
  return map;
}
function lessonRow(c) {
  const meta = [];
  if (c.video) meta.push('<span class="badge blue">视频链接</span>');
  if (c.seconds) meta.push('<span class="badge">已学 ' + fmtClock(c.seconds) + '</span>');
  const cm = courseMinutes(c);
  meta.push('<button class="badge ' + (cm.estimated ? 'amber' : '') + '" data-act="edit-min" data-id="' + c.id + '" title="点击修改预计时长">' +
    cm.min + ' 分钟' + (cm.estimated ? '·估算' : '') + '</button>');
  const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
  const doneRounds = Math.min(rounds, Number(c.reviewed) || 0);
  const gate = roundGate();
  const nextLocked = c.done && doneRounds < rounds && (doneRounds + 1) > gate.allowed;
  const reviewBadge = doneRounds
    ? '<span class="badge ' + (doneRounds >= rounds ? 'green' : 'amber') + '">第 ' + doneRounds + ' 轮已完成</span> <span class="badge">复习 ' + doneRounds + '/' + rounds + '</span>'
    : '';
  const lockBadge = '';
  return '<div class="lesson ' + (c.done ? 'done' : '') + '">' +
    '<button class="play" data-act="play" data-id="' + c.id + '" title="播放并计时">▶</button>' +
    '<div class="lname">' +
      '<div class="n">' + esc(c.name) + (c.done ? ' <span class="badge green">已完成</span>' : '') + (c.studyMode === 'review' ? ' <span class="badge amber">新增 · 只排复习</span>' : '') + (reviewBadge ? ' ' + reviewBadge : '') + (lockBadge ? ' ' + lockBadge : '') + '</div>' +
      '<div class="o">原始：' + esc(c.original) + (meta.length ? '　' + meta.join(' ') : '') + '</div>' +
    '</div>' +
    '<div class="acts">' +
      (c.done && doneRounds < rounds ? '<button class="btn sm" data-act="review-course" data-id="' + c.id + '"' + (nextLocked ? ' title="' + esc(gate.note) + '"' : '') + '>' + (nextLocked ? '复习（未解锁）' : '复习 +1') + '</button>' : '') +
      '<button class="btn sm ghost" data-act="done" data-id="' + c.id + '">' + (c.done ? '取消完成' : '标记完成') + '</button>' +
      '<button class="btn sm ghost" data-act="rename" data-id="' + c.id + '">改名</button>' +
      '<button class="btn sm danger" data-act="del-course" data-id="' + c.id + '">删除</button>' +
    '</div>' +
  '</div>';
}

  return '<div class="grid">' +

function submitBulkRename(form) {
  const level = form.level.value;
  const from = String(form.from.value || '').trim();
  const to = String(form.to.value || '').trim();
  if (!to) { toast('请填写新名称', 'warn'); return; }
  if (to === from) { toast('新名称和原来一样', 'warn'); return; }
  if (state.courses.some(c => (level === 'subject' ? c.subject === to : (c.subject === form.subject.value && c.chapter === to)))) {
    toast('「' + to + '」已经存在，换一个名字', 'warn'); return;
  }
  let n = 0;
  if (level === 'subject') {
    state.courses.forEach(function (c) { if (c.subject === from) { c.subject = to; n++; } });
    ['real'].forEach(function (k) {
      state.questions[k].forEach(function (q) { if (q.subject === from) q.subject = to; });
    });
    if (state.pinned[from]) { state.pinned[to] = state.pinned[from]; delete state.pinned[from]; }
    Object.keys(state.open).forEach(function (key) {
      if (key === 's:' + from) { state.open['s:' + to] = state.open[key]; delete state.open[key]; }
    });
  } else {
    const subj = form.subject.value;
    state.courses.forEach(function (c) { if (c.subject === subj && c.chapter === from) { c.chapter = to; n++; } });
    ['real'].forEach(function (k) {
      state.questions[k].forEach(function (q) { if (q.subject === subj && q.chapter === from) q.chapter = to; });
    });
    Object.keys(state.open).forEach(function (key) {
      if (key === 'c:' + subj + '|' + from) { state.open['c:' + subj + '|' + to] = state.open[key]; delete state.open[key]; }
    });
  }
  save(true);
  closeModal();
  render();
  toast(level === 'subject' ? ('已把「' + from + '」改为「' + to + '」，共 ' + n + ' 节课') : ('已把「' + from + '」改为「' + to + '」，共 ' + n + ' 节课'), 'ok');
}

/* ---------- 习题 / 真题 ---------- */
function filteredQuestions(kind) {
  const b = state.ui.bank[kind] || { q: '', subject: '', status: '', year: '' };
  let list = bankOf(kind).slice();
  if (b.subject) list = list.filter(q => q.subject === b.subject);
  if (b.year) list = list.filter(q => String(q.year || '') === String(b.year));
  if (b.q) {
    const t = String(b.q).trim().toLowerCase();
    if (t) list = list.filter(function (q) {
      return ((q.name || '') + ' ' + q.stem + ' ' + q.answer + ' ' + q.chapter + ' ' + q.section + ' ' + (q.year || '')).toLowerCase().indexOf(t) >= 0;
    });
  }
  if (b.status === 'undone') list = list.filter(q => Number(q.reviewDone) < (Number(q.reviewTarget) || 1));
  if (b.status === 'done') list = list.filter(q => Number(q.reviewDone) >= (Number(q.reviewTarget) || 1));
  if (b.status === 'wrong') list = list.filter(q => q.wrong);
  /* 真题库通常只有一个科目：直接按年份降序；年份相同再按科目、名称 */
  list.sort(function (x, y) {
    const xy = Number(x.year) || 0, yy = Number(y.year) || 0;
    if (xy !== yy) return yy - xy;
    const s = String(x.subject).localeCompare(String(y.subject), 'zh');
    if (s) return s;
    return String(x.name || '').localeCompare(String(y.name || ''), 'zh');
  });
  return list;
}
function qDone(q) { return Number(q.reviewDone) >= (Number(q.reviewTarget) || 1); }

/* ---------- 习题知识点统计（科目 → 知识点） ---------- */
function pointOf(q) {
  return (q.section || q.chapter || '未分知识点').trim() || '未分知识点';
}
function kbStats(kind) {
  const qs = bankOf(kind);
  const map = new Map();
  qs.forEach(function (q) {
    const subject = q.subject || '未分类';
    const point = pointOf(q);
    const key = subject + '|' + point;
    let g = map.get(key);
    if (!g) { g = { subject: subject, point: point, total: 0, did: 0, mastered: 0, wrong: 0 }; map.set(key, g); }
    g.total += 1;
    const did = !!(q.done || (Number(q.attempts) || 0) > 0);
    if (did) g.did += 1;
    if (q.done && !q.wrong) g.mastered += 1;
    if (q.wrong) g.wrong += 1;
  });
  const rows = Array.from(map.values()).map(function (g) {
    g.doneRate = g.total ? Math.round(g.mastered * 100 / g.total) : 0;
    g.wrongRate = g.did ? Math.round(g.wrong * 100 / g.did) : 0;
    return g;
  }).sort(function (a, b) { return b.wrongRate - a.wrongRate || a.doneRate - b.doneRate || a.point.localeCompare(b.point); });
  const bySubj = new Map();
  rows.forEach(function (g) {
    if (!bySubj.has(g.subject)) bySubj.set(g.subject, []);
    bySubj.get(g.subject).push(g);
  });
  return { rows: rows, bySubj: bySubj, total: qs.length };
}
function kbPanel(kind) {
  const s = kbStats(kind);
  if (!s.total) return '';
  let inner = '';
  s.bySubj.forEach(function (list, subject) {
    let total = 0, did = 0, mastered = 0, wrong = 0;
    list.forEach(function (g) { total += g.total; did += g.did; mastered += g.mastered; wrong += g.wrong; });
    const dr = total ? Math.round(mastered * 100 / total) : 0;
    const wr = did ? Math.round(wrong * 100 / did) : 0;
    inner += '<details class="kb-subj"><summary>' +
        '<span class="badge blue">' + esc(subject) + '</span>' +
        '<span class="small muted">' + total + ' 题 · 完成率 ' + dr + '% · 错误率 ' + wr + '%</span>' +
        '<span class="spacer"></span>' +
        '<span class="kb-bars" title="绿=完成率 ' + dr + '%，红=错误率 ' + wr + '%"><b class="ok" style="width:' + dr + '%"></b><b class="bad" style="width:' + wr + '%"></b></span>' +
      '</summary>' +
      '<div class="kb-list">' + list.map(function (g) {
        return '<div class="kb-row">' +
          '<span class="n">' + esc(g.point) + '</span>' +
          '<span class="pct">完成 ' + g.doneRate + '%</span>' +
          '<span class="pct" style="color:' + (g.wrongRate >= 30 ? 'var(--red,#c0392b)' : 'var(--muted)') + '">错误 ' + g.wrongRate + '%</span>' +
          '<span class="pct muted">' + g.mastered + '/' + g.total + ' 掌握 · ' + g.did + ' 做</span>' +
        '</div>';
      }).join('') + '</div>' +
    '</details>';
  });
  return '<details class="kb-wrap"><summary class="kb-head">' +
      '按知识点统计（科目 → 知识点）' +
      '<span class="small muted">共 ' + s.total + ' 题 · 点击展开</span>' +
    '</summary>' +
    '<div class="kb-body">' + inner + '</div>' +
    '<p class="help" style="margin-top:8px">口径：<b>错误率 = 错题数 ÷ 已做题数</b>（错题数 = 仍在错题队列；已做 = 做过或已标记完成）；' +
      '<b>完成率 = 已掌握数 ÷ 总题数</b>（已掌握 = 已标记完成且不在错题队列）。</p>' +
  '</details>';
}

/* ---------- 按天打卡课表 ---------- */
function taskDone(t) {
  const c = findCourse(t.id);
  if (!c) return false;
  if (t.kind === 'learn') return !!c.done;
  return (Number(c.reviewed) || 0) >= (Number(t.round) || 1);
}
function toggleCourseDone(c) {
  const today = todayStr();
  if (!c.done) {
    c.done = true;
    c.doneAt = today;
    dailyGet(today).coursesDone += 1;
    donePop(c.name);
  } else {
    c.done = false;
    if (c.doneAt && state.daily[c.doneAt]) {
      state.daily[c.doneAt].coursesDone = Math.max(0, state.daily[c.doneAt].coursesDone - 1);
    }
    c.doneAt = '';
    toast('已取消完成：' + c.name);
  }
  settlePoints();          /* 完成动作发生时才结算，改计划不会补算历史 */
  save();
  return !!c.done;
}
function completeCourseRound(c, round) {
  const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
  const cur = Number(c.reviewed) || 0;
  if (!c.done) { toast('先标记「已完成」再复习', 'warn'); return false; }
  if (cur >= rounds) { toast('这门课已完成 ' + rounds + ' 轮复习'); return false; }
  const want = Math.min(rounds, Math.max(cur + 1, Number(round) || cur + 1));
  const gate = roundGate();
  if (want > gate.allowed) { toast('第 ' + want + ' 轮还没解锁：' + gate.note, 'warn'); return false; }
  c.reviewed = want;
  c.reviewLog = Array.isArray(c.reviewLog) ? c.reviewLog : [];
  c.reviewLog.push(todayStr());
  settlePoints();
  save();
  toast('已完成第 ' + want + ' 轮复习：' + c.name, 'ok');
  return true;
}

  const out = [];

  for (let i = 30; i >= 1; i--) {

    if (state.restDays[d] && !dailyGet(d).restCheckin) out.push(d);
  }
  return out;

/* ---------- 复习提醒 ---------- */
function reviewInfo() {
  const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
  const doneCourses = state.courses.filter(function (c) { return c.done; });
  const rows = [];
  for (let r = 1; r <= rounds; r++) {
    const ok = doneCourses.filter(function (c) { return (Number(c.reviewed) || 0) >= r; }).length;
    rows.push({ r: r, ok: ok, total: doneCourses.length, pct: doneCourses.length ? Math.round(ok * 100 / doneCourses.length) : 0 });
  }
  const cur = rows.filter(function (x) { return x.ok < x.total; })[0] || rows[rows.length - 1] || { r: 1 };
  const pending = doneCourses.filter(function (c) { return (Number(c.reviewed) || 0) < cur.r; });
  return { rounds: rounds, doneCourses: doneCourses, rows: rows, current: cur.r, pending: pending };
}

    return '<div class="card"><div class="section-title"><h2>课程复习轮次</h2></div>' +

  }

    return '<div class="card"><div class="section-title"><h2>课程复习轮次</h2><span class="spacer"></span>' +

      '<p class="help">先把看完的课标记「已完成」，它们才会进入复习轮次。</p></div>';
  }
  const gate = roundGate();
  const bars = info.rows.map(function (x) {
    const locked = x.r > gate.allowed;
    return '<div style="margin-bottom:12px">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:4px">' +

        '<span class="small muted">' + x.ok + ' / ' + x.total + ' 节</span></div>' +
      '<div class="bar ' + (x.ok >= x.total ? 'green' : (x.r === info.current && !locked ? 'amber' : '')) + '"><i style="width:' + x.pct + '%"></i></div>' +
    '</div>';
  }).join('');
  const pendingHTML = info.pending.length
    ? info.pending.slice(0, 30).map(function (c) {

function viewReview() {
  const due = dueReviews();
  const today = todayStr();
  const overdue = due.filter(function (x) { return x.w.dueDate < today; }).length;
  const up = upcomingReviews(7);
  const upKeys = Object.keys(up).sort();
  const upTotal = upKeys.reduce(function (a, k) { return a + up[k]; }, 0);

  let listHTML;
  if (!due.length) {
    listHTML = '<div class="empty"><span class="em">✅</span><h3>今天没有到期的错题</h3>' +

    listHTML = due.map(function (item) {
      const w = item.w, q = item.q;
      return '<div class="qitem">' +
        '<div class="meta">' +
          '<span class="badge blue">' + esc(q.subject) + '</span>' +
          '<span class="chip">' + esc(q.chapter) + (q.section ? ' · ' + esc(q.section) : '') + '</span>' +

          (w.dueDate < today ? '<span class="badge red">逾期 ' + diffDays(w.dueDate, today) + ' 天</span>' : '<span class="badge green">今日到期</span>') +
        '</div>' +
        '<div class="stem clamp">' + esc(q.stem) + '</div>' +
        '<div class="small muted" style="margin-top:6px">已复习 ' + (w.count || 0) + ' 次' + (w.lastAt ? ' · 上次 ' + esc(w.lastAt) : '') + '</div>' +
        '<div class="acts">' +
          '<button class="btn sm primary" data-act="review-do" data-id="' + esc(w.id) + '">重做这题</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  const upHTML = upKeys.length
    ? '<div class="row" style="gap:8px">' + upKeys.map(function (k) {
        return '<span class="chip">' + fmtDateCN(k) + ' · ' + up[k] + ' 题</span>';

  return '<div class="grid">' +
    '<div class="card"><div class="section-title"><h2>艾宾浩斯复习</h2><span class="spacer"></span>' +
      '<span class="badge amber">间隔 1 / 2 / 4 / 7 / 15 / 30 天</span></div>' +
      '<div class="grid cols-4">' +
        '<div class="stat"><span class="k">今日应复习</span><span class="v">' + due.length + ' 题</span><span class="s">' + (overdue ? '其中逾期 ' + overdue + ' 题' : '无逾期') + '</span></div>' +
        '<div class="stat"><span class="k">错题队列</span><span class="v">' + state.wrong.length + ' 题</span><span class="s">答对并走完 30 天后移出</span></div>' +
        '<div class="stat"><span class="k">未来 7 天</span><span class="v">' + upTotal + ' 题</span><span class="s">按计划到期数量</span></div>' +
        '<div class="stat"><span class="k">复习后</span><span class="v">自动顺延</span><span class="s">答错则回到第 1 天</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="section-title"><h2>今天要复习的题</h2><span class="spacer"></span>' +
      (due.length ? '<button class="btn sm teal" data-act="review-all">依次复习全部（' + due.length + '）</button>' : '') +
      '</div><div class="stack">' + listHTML + '</div></div>' +
    reviewRoundsCard() +
    '<div class="card"><div class="section-title"><h2>未来 7 天复习量</h2></div>' + upHTML + '</div>' +
  '</div>';
}
