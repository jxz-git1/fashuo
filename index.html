document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const kind = el.dataset.kind;
  const id = el.dataset.id;

  switch (act) {
    case 'tab':
      state.ui.tab = el.dataset.tab;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'modal-close':
      dismissModal();
      break;
    case 'overlay':
      if (e.target.classList && e.target.classList.contains('overlay')) dismissModal();
      break;

    case 'ov-toggle': {
      const key = el.dataset.key;
      state.ui.overviewOpen[key] = !state.ui.overviewOpen[key];
      save();
      render();
      break;
    }

    case 'add-course':
      openCourseModal();
      break;
    case 'sample-courses':
      loadSampleData();
      break;
    case 'csv-open':
      openCsvModal();
      break;
    case 'files-open':
      openFilesModal();
      break;
    case 'collapse-all':
      state.open = {};
      save();
      render();
      toast('已全部折叠，📌 固定的科目仍然展开');
      break;

    case 'toggle-subject': {
      const key = 's:' + el.dataset.key;
      state.open[key] = !state.open[key];
      save();
      render();
      break;
    }
    case 'pin-subject': {
      const key = el.dataset.key;
      state.pinned[key] = !state.pinned[key];
      if (state.pinned[key]) state.open['s:' + key] = true;
      save();
      render();
      toast(state.pinned[key] ? '已固定展开：' + key : '已取消固定：' + key);
      break;
    }
    case 'toggle-chapter': {
      const key = 'c:' + el.dataset.key;
      state.open[key] = !state.open[key];
      save();
      render();
      break;
    }

    case 'play':
      openPlayer(id);
      break;
    case 'done': {
      const c = findCourse(id);
      if (!c) break;
      const isDone = toggleCourseDone(c);
      render();
      if (isDone) {
        const rowEl = document.querySelector('.lesson [data-act="done"][data-id="' + c.id + '"]');
        const box = rowEl && rowEl.closest ? rowEl.closest('.lesson') : null;
        if (box) { box.classList.add('just-done'); }
      }
      break;
    }
    case 'real-review': {
      const q = findQuestion('real', id);
      if (!q) break;
      const tgt = Number(q.reviewTarget) || 1;
      q.reviewDone = Math.min(tgt, (Number(q.reviewDone) || 0) + 1);
      if (q.reviewDone >= tgt) { q.done = true; q.doneAt = todayStr(); }
      q.wrong = false;
      save(); render();
      toast('「' + (q.name || '真题') + '」已复习 ' + q.reviewDone + '/' + tgt + ' 次', 'ok');
      break;
    }
    case 'real-plan-toggle': {
      const qid = id;
      const ids = state.realPlan.ids || [];
      const i = ids.indexOf(qid);
      if (i >= 0) ids.splice(i, 1); else ids.push(qid);
      state.realPlan.ids = ids;
      save(); render();
      break;
    }
    case 'real-plan-confirm': {
      state.realPlan.ids = (state.realPlan.ids || []).filter(function (x) { return !!findQuestion('real', x); });
      state.realPlan.confirmedAt = Date.now();
      save(); render();
      toast('真题计划已确认，总览会显示总进度', 'ok');
      break;
    }
    case 'rest-day-toggle': {
      const d = el.dataset.date || todayStr();
      if (state.restDays[d]) { delete state.restDays[d]; toast('已取消休息日：' + d); }
      else {
        state.restDays[d] = true;
        settlePoints();
        toast('已把 ' + d + ' 设为休息日（当天不计奖励）', 'ok');
      }
      save(); render();
      break;
    }
    case 'rest-checkin': {
      const d = el.dataset.date || todayStr();
      dailyGet(d).restCheckin = true;
      save(); render();
      toast('已补打卡：' + d + '（休息日，不计奖励）', 'ok');
      break;
    }
    case 'redeem-open':
      openRedeemModal();
      break;
    case 'redeem-now': {
      const date = String((document.getElementById('redeemDate') || {}).value || '');
      redeemRestDay(date);
      break;
    }
    case 'redeem-revoke': {
      const date = el.dataset.date || '';
      revokeRestDay(date);
      break;
    }
    case 'review-course': {
      const c = findCourse(id);
      if (!c) break;
      if (completeCourseRound(c, (Number(c.reviewed) || 0) + 1)) render();
      break;
    }
    case 'review-round-all': {
      const r = Number(el.dataset.round) || 1;
      const rounds = Math.max(1, Number(state.plan.reviewRounds) || 3);
      const gate = roundGate();
      if (r > gate.allowed) { toast('第 ' + r + ' 轮还没解锁：' + gate.note, 'warn'); break; }
      const goal = Math.min(rounds, r);
      let n = 0;
      state.courses.forEach(function (c) {
        if (!c.done) return;
        const cur = Number(c.reviewed) || 0;
        if (cur >= goal) return;
        c.reviewed = goal;
        c.reviewLog = Array.isArray(c.reviewLog) ? c.reviewLog : [];
        c.reviewLog.push(todayStr());
        n++;
      });
      if (!n) { toast('这一轮没有需要复习的课程'); break; }
      save();
      render();
      toast('已标记第 ' + goal + ' 轮复习完成：' + n + ' 节', 'ok');
      break;
    }
    case 'rename':
      openRenameModal(id);
      break;
    case 'edit-min':
      openMinutesModal(id);
      break;
    case 'del-course': {
      const c = findCourse(id);
      if (!c) break;
      askConfirm('删除课程「' + c.name + '」？\n学习时长也会一并移除，此操作不可撤销。', '删除', true).then(function (ok) {
        if (!ok) return;
        state.courses = state.courses.filter(x => x.id !== id);
        save(true);
        render();
        toast('已删除课程');
      });
      break;
    }
    case 'del-chapter': {
      const key = el.dataset.key || '';
      const parts = key.split('|');
      const subject = parts[0], chapter = parts.slice(1).join('|');
      const arr = state.courses.filter(c => c.subject === subject && c.chapter === chapter);
      if (!arr.length) { toast('该章下没有课程', 'warn'); break; }
      askConfirm('删除「' + subject + ' · ' + chapter + '」下的 ' + arr.length + ' 节课？\n学习时长也会一并移除，此操作不可撤销。', '删除', true).then(function (ok) {
        if (!ok) return;
        state.courses = state.courses.filter(c => !(c.subject === subject && c.chapter === chapter));
        save(true);
        render();
        toast('已删除 ' + arr.length + ' 节课程');
      });
      break;
    }
    case 'del-subject': {
      const subject = el.dataset.key || '';
      const arr = state.courses.filter(c => c.subject === subject);
      if (!arr.length) { toast('该科目下没有课程', 'warn'); break; }
      askConfirm('删除科目「' + subject + '」下的全部 ' + arr.length + ' 节课？\n学习时长也会一并移除，此操作不可撤销。', '删除', true).then(function (ok) {
        if (!ok) return;
        state.courses = state.courses.filter(c => c.subject !== subject);
        delete state.pinned[subject];
        Object.keys(state.open).forEach(function (k) { if (k === 's:' + subject || k.indexOf('c:' + subject + '|') === 0) delete state.open[k]; });
        save(true);
        render();
        toast('已删除科目「' + subject + '」的 ' + arr.length + ' 节课');
      });
      break;
    }
    case 'course-bulk':
      openCourseBulkModal();
      break;
    case 'rename-subject':
      openBulkRenameModal('subject', el.dataset.key || '');
      break;
    case 'rename-chapter':
      openBulkRenameModal('chapter', el.dataset.key || '');
      break;
    case 'zhuma-import':
      zhumaImport(el.dataset.kind);
      break;
    case 'cb-del':
      deleteCheckedCourses();
      break;
    case 'course-detect':
      detectCourseLinks();
      break;
    case 'course-parts': {
      const info = parseVideoUrl(fieldVal('cVideo') || '');
      const plans = planPartsFromText(fieldVal('cParts'), info);
      if (!plans.length) { toast('先在上面的框里粘贴分 P 名称（每行一个）', 'warn'); break; }
      courseDetect = plans;
      const box = document.getElementById('cDetect');
      if (box) box.innerHTML = renderDetected(plans);
      toast('已生成 ' + plans.length + ' 个分 P，勾选后点「保存课程」', 'ok');
      break;
    }
    case 'settings-open':
      openSettingsModal();
      break;
    case 'theme-cycle':
      cycleTheme();
      break;
    case 'theme-set':
      setTheme(el.getAttribute('data-theme-id') || 'soft');
      break;
    case 'sync-now':
      if (!SYNC_ON) { toast('当前是以文件方式打开，同步未启用：请用「启动网盘助手.bat」打开 http 版本', 'warn'); break; }
      syncNow(true);
      break;
    case 'reminder-ics':
      downloadReminderICS();
      break;
    case 'reminder-test':
      sendReminder(true);
      break;
    case 'cloud-open':
      openCloudShare();
      break;
    case 'cloud-fetch':
      fetchCloudNames();
      break;
    case 'cloud-extract':
      extractPastedNames();
      break;

    case 'add-q':
      openQuestionModal(kind);
      break;
    case 'edit-q':
      openQuestionModal(kind, id);
      break;
    case 'del-q': {
      const q = findQuestion(kind, id);
      if (!q) break;
      askConfirm('删除这道题？\n\n' + (q.stem || '').slice(0, 60), '删除', true).then(function (ok) {
        if (!ok) return;
        state.questions[kind] = bankOf(kind).filter(x => x.id !== id);
        removeWrong(kind, id);
        save(true);
        render();
        toast('已删除题目');
      });
      break;
    }
    case 'qsel-all':
      selectAllFiltered(kind, true);
      break;
    case 'qsel-none':
      selectAllFiltered(kind, false);
      break;
    case 'qdel-sel': {
      const ids = Object.keys(qSel[kind] || {});
      if (!ids.length) { toast('还没有勾选题目', 'warn'); break; }
      askConfirm('删除已勾选的 ' + ids.length + ' 道' + KIND_LABEL[kind] + '？\n错题队列里的对应记录也会一并移除，此操作不可撤销。', '批量删除', true).then(function (ok) {
        if (ok) deleteQuestions(kind, ids);
      });
      break;
    }
    case 'qdel-filtered': {
      const list = filteredQuestions(kind);
      if (!list.length) { toast('当前筛选结果为空', 'warn'); break; }
      askConfirm('删除当前筛选出的 ' + list.length + ' 道' + KIND_LABEL[kind] + '？\n' + filteredHint(kind) + '\n此操作不可撤销。', '批量删除', true).then(function (ok) {
        if (ok) deleteQuestions(kind, list.map(function (q) { return q.id; }));
      });
      break;
    }
    case 'practice':
      startPractice(kind);
      break;
    case 'practice-one':
      openRunner({ items: [{ kind: kind, id: id }], mode: 'practice', title: KIND_LABEL[kind] + ' · 单题练习' });
      break;
    case 'pdf-open':
      openPdfImportModal(kind);
      break;
    case 'pdf-scan':
      scanPdfDir();
      break;
    case 'pdf-import-scan':
      importScannedPdfs();
      break;
    case 'pdf-scan-preview':
      previewScannedPdf(Number(el.dataset.idx));
      break;
    case 'pdf-scan-preview-all':
      previewAllSelected();
      break;
    case 'pdf-ocr':
      ocrScannedPdf(Number(el.dataset.idx));
      break;
    case 'pdf-prog': {
      const key = el.dataset.key;
      const input = document.querySelector('[data-pdf-pct="' + key + '"]');
      const pct = setPdfProgress(key, input ? input.value : 0);
      if (input) {
        input.value = pct;
        const row = input.closest('.rvline');
        const hint = row ? row.querySelector('[data-pdf-hint]') : null;
        if (hint) hint.textContent = pdfRangeText(input.dataset.from, input.dataset.to, pct, input.dataset.pc);
      }
      toast('已记录完成比例 ' + pct + '%', 'ok');
      break;
    }

    case 'plan-save':
      break;

    case 'export':
      exportData();
      break;
    case 'import-open':
      openImportModal();
      break;
    case 'reset':
      resetData();
      break;

    case 'review-do': {
      const w = state.wrong.find(function (x) { return x.id === id; });
      if (!w) { toast('该复习项已不存在', 'warn'); break; }
      openRunner({ items: [{ kind: w.kind, id: w.qid }], mode: 'review', title: '错题复习' });
      break;
    }
    case 'review-all': {
      const due = dueReviews();
      if (!due.length) { toast('今天没有到期错题'); break; }
      openRunner({ items: due.map(x => ({ kind: x.w.kind, id: x.w.qid })), mode: 'review', title: '今日错题复习' });
      break;
    }

    case 'runner-next':
      nextRunner();
      break;
    case 'runner-close':
      runner = null;
      closeModal();
      render();
      break;
    case 'runner-hint':
      applyGrade(false, true);
      break;
    case 'runner-override-yes':
      gradeOverride(true);
      break;
    case 'runner-override-no':
      gradeOverride(false);
      break;

    case 'pf-all':
    case 'pf-none': {
      const on = act === 'pf-all';
      document.querySelectorAll('.preview-row .pchk').forEach(function (cb) { cb.checked = on; });
      break;
    }

    default:
      break;
  }
});

let courseDetect = null;

const CORS_PROXIES = [
  function (u) { return 'https://cors.eu.org/' + u; },
  function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
  function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },

async function fetchOne(u, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 7000);
  try {
    const r = await fetch(u, { signal: ctrl.signal, credentials: 'omit', mode: 'cors' });
    if (!r.ok) return '';
    const txt = await r.text();
    return txt || '';
  } finally {
    clearTimeout(timer);
  }
}
async function fetchTextProxies(url, timeoutMs) {
  // 直连 + 多个代理并行，谁先成功用谁（都在超时后放弃）
  const urls = [url].concat(CORS_PROXIES.map(function (p) { return p(url); }));
  return new Promise(function (resolve) {
    let pending = urls.length, done = false;
    urls.forEach(function (u) {
      fetchOne(u, timeoutMs).then(function (txt) {
        if (!done && txt && txt.length > 1) { done = true; resolve(txt); }
      }).catch(function () { /* 忽略 */ }).then(function () {
        pending--;
        if (pending === 0 && !done) resolve('');
      });
    });
  });
}

function parseVideoUrl(url) {
  const s = String(url || '').trim();
  const out = { platform: 'other', bvid: '', p: 0, raw: s };
  const b = s.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/i) || s.match(/\b(BV[0-9A-Za-z]{10})\b/);
  if (b) {
    out.platform = 'bili';
    out.bvid = b[1];
    const pm = s.match(/[?&]p=(\d+)/);
    if (pm) out.p = Number(pm[1]) || 0;
    return out;
  }
  if (/youtu\.be|youtube\.com/i.test(s)) out.platform = 'yt';
  return out;
}
function deriveNameFromLink(url) {
  const s = String(url || '');
  try {
    const u = new URL(s);
    if (/youtube\.com|youtu\.be/i.test(u.hostname)) {
      const v = u.searchParams.get('v') || (u.pathname.split('/').filter(Boolean).pop() || '');
      return v ? 'YouTube · ' + v : 'YouTube 视频';
    }
    const last = decodeURIComponent((u.pathname || '').split('/').filter(Boolean).pop() || '');
    const fromQuery = u.searchParams.get('name') || u.searchParams.get('title') || '';
    const nm = stripExt(fromQuery || last).replace(/[_]+/g, ' ').trim();
    return nm || (u.hostname + ' 视频');
  } catch (e) {
    return stripExt(s.split('/').pop()) || '未命名课程';
  }
}
function jsonpGet(url, param, timeoutMs) {
  return new Promise(function (resolve, reject) {
    const name = 'dshJsonp_' + Math.random().toString(36).slice(2, 10);
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, timeoutMs || 9000);
    function cleanup() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function (d) { cleanup(); resolve(d); };
    s.onerror = function () { cleanup(); reject(new Error('load error')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + param + '=' + name;
    document.head.appendChild(s);
  });
}
/* B 站接口支持的 JSONP：固定回调名 jsonp（url 里会补 jsonp=jsonp&callback=jsonp） */
function jsonpFixed(url, cbName, timeoutMs) {
  return new Promise(function (resolve, reject) {
    const name = cbName || 'jsonp';
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(function () { finish(); reject(new Error('timeout')); }, timeoutMs || 8000);
    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function (d) { finish(); resolve(d); };
    s.onerror = function () { finish(); reject(new Error('load error')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'jsonp=jsonp&callback=' + name;
    document.head.appendChild(s);
  });
}
async function biliPages(bvid) {
  if (!bvid) return null;
  if (Object.prototype.hasOwnProperty.call(biliCache, bvid)) return biliCache[bvid];
  // 1) 首选：B 站支持固定回调名的 JSONP，<script> 不受 CORS 限制
  try {
    const j = await jsonpFixed('https://api.bilibili.com/x/web-interface/view?bvid=' + encodeURIComponent(bvid), 'jsonp', 8000);
    if (j && j.code === 0 && j.data && Array.isArray(j.data.pages) && j.data.pages.length) {
      biliCache[bvid] = j.data.pages;
      return j.data.pages;
    }
  } catch (e) { /* 退到代理 */ }
  const apis = [
    BILI_PAGE_API + encodeURIComponent(bvid),
    'https://api.bilibili.com/x/web-interface/view?bvid=' + encodeURIComponent(bvid)
  ];
  let pages = null;
  for (let i = 0; i < apis.length && !pages; i++) {
    const txt = await fetchTextProxies(apis[i], 7000);
    if (!txt) continue;
    try {
      const j = JSON.parse(txt);
      if (j && j.code === 0 && j.data) {
        if (Array.isArray(j.data)) pages = j.data;
        else if (Array.isArray(j.data.pages)) pages = j.data.pages;
      }
    } catch (e) { /* 代理返回了 HTML 或错误页 */ }
  }
  if (pages && pages.length) biliCache[bvid] = pages;
  return pages;
}
function pgDurationMin(pg) {
  const sec = Number(pg && pg.duration);
  if (!(sec > 0)) return 0;
  return clamp(Math.round(sec / 60), 1, 600);

async function planCoursesFromLinks(links, fallbackName) {
  const out = [];
  for (let i = 0; i < links.length; i++) {
    const url = links[i];
    const info = parseVideoUrl(url);
    if (info.platform === 'bili') {
      const pages = await biliPages(info.bvid);
      if (pages && pages.length) {
        if (info.p) {
          const pg = pages.filter(function (x) { return x.page === info.p; })[0] || pages[0];
          out.push({ part: pg.page, name: pg.part || ('P' + pg.page), url: 'https://www.bilibili.com/video/' + info.bvid + '?p=' + pg.page, minutes: pgDurationMin(pg), minutesSource: 'bili' });
        } else {
          pages.forEach(function (pg) {
            out.push({ part: pg.page, name: pg.part || ('P' + pg.page), url: 'https://www.bilibili.com/video/' + info.bvid + '?p=' + pg.page, minutes: pgDurationMin(pg), minutesSource: 'bili' });
          });
        }
        continue;
      }
      out.push({ part: info.p || 1, name: fallbackName || ('B站 ' + info.bvid + (info.p ? ' P' + info.p : '')), url: url });
      continue;
    }
    out.push({ part: 0, name: deriveNameFromLink(url), url: url });

function planPartsFromText(text, info) {
  const lines = String(text || '').split(/\r?\n/)
    .map(function (s) { return s.replace(/\u00a0/g, ' ').trim(); })
    .filter(Boolean);
  const out = [];
  let autoPart = 0;
  lines.forEach(function (line) {
    if (/^(选集|分P|分 ?p|目录|播放全部|共\s*\d+\s*[Pp])/i.test(line)) return;
    if (/^\d{1,3}:\d{2}(:\d{2})?$/.test(line)) return;
    let s = line.replace(/^[•·\-*]\s*/, '');
    s = s.replace(/\s+\d{1,3}:\d{2}(:\d{2})?$/, '').trim(); // 去尾部时长 01:23:45
    let part = autoPart + 1;
    let name = s;
    let m = s.match(/^[Pp]\s*(\d{1,3})\s*[.、．)）:：\-]?\s*(.*)$/);
    if (!m) m = s.match(/^(\d{1,3})\s*[.、．)）:：]\s*(.*)$/);
    if (m) {
      part = Number(m[1]) || (autoPart + 1);
      name = (m[2] || '').trim();
    }
    name = name.replace(/\s+/g, ' ').slice(0, 60);
    if (!name) return;
    autoPart = Math.max(autoPart + 1, part);
    const url = (info && info.platform === 'bili' && info.bvid)
      ? ('https://www.bilibili.com/video/' + info.bvid + '?p=' + part)
      : '';
    out.push({ part: part, name: name, url: url });
  });

}

async function submitCourse() {

  const chapter = fieldVal('cChapter') || '未分章';
  const sectionField = fieldVal('cSection');
  const nameField = fieldVal('cName');

  const links = raw.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(function (s) { return /^https?:\/\//i.test(s); });

  let plans = null;
  if (partsText) {
    // 手动列表优先：不依赖任何网络
    plans = planPartsFromText(partsText, parseVideoUrl(raw));
    if (!plans.length) { toast('粘贴的列表里没有可用的行', 'warn'); return; }
  } else if (links.length) {
    const picks = document.getElementById('cPicks');
    if (picks) {
      plans = [];
      picks.querySelectorAll('input[data-plan]').forEach(function (cb) {
        if (cb.checked && courseDetect) plans.push(courseDetect[Number(cb.dataset.plan)]);
      });
      plans = plans.filter(Boolean);
      if (!plans.length) { toast('请至少勾选一个课程', 'warn'); return; }
    } else {
      toast('正在识别链接…');
      plans = await planCoursesFromLinks(links, nameField);
    }
  } else {
    if (!nameField && !sectionField) { toast('请填写课程名称，或粘贴视频链接自动生成', 'warn'); return; }
    plans = [{ part: 0, name: nameField || sectionField, url: '' }];
  }

  const only = plans.length === 1;
  let added = 0, skipped = 0;
  plans.forEach(function (p) {
    const section = sectionField || (only && nameField) || p.name || '未分节';
    const name = (only && nameField) ? nameField : (p.name || section);
    const dup = state.courses.some(function (c) {
      return c.subject === subject && c.chapter === chapter && c.section === section;
    });
    if (dup) { skipped++; return; }
    let mins = Number(p.minutes) > 0 ? Math.round(p.minutes) : 0;
    let src = mins > 0 ? (p.minutesSource || 'bili') : '';
    if (!mins) {
      /* B 站没给时长时，再看课程名/文件名里的时长 */
      mins = durationFromName(p.name || section);
      if (mins > 0) src = 'text';

    state.courses.push(markReviewOnly({
      id: uid('c'), subject: subject, chapter: chapter, section: section,
      original: p.name || section, name: name, video: p.url || '',
      seconds: 0, done: false, doneAt: '', createdAt: Date.now(),
      minutes: mins > 0 ? clamp(mins, 1, 600) : 0,
      minutesSource: src,
      reviewed: 0, reviewLog: []
    }));
    added++;
  });
  save(true);
  closeModal();
  render();
  if (added) toast('已添加 ' + added + ' 节课程' + (skipped ? '，跳过 ' + skipped + ' 个重复项' : ''), 'ok');
  else toast('没有新增课程（' + skipped + ' 个重复项）', 'warn');
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const s = String(text || '').replace(/^\uFEFF/, '');
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') { /* skip */ }
      else field += ch;
    }
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}

/* ---------- 网盘文件名解析 ---------- */
const VIDEO_EXT_RE = /\.(mp4|mkv|avi|mov|flv|wmv|m4v|rmvb|rm|ts|webm|mpg|mpeg|3gp|vob|f4v)$/i;

const CHAPTER_RE = new RegExp('第\\s*[' + CN_NUM + ']+\\s*[章编部]');
const SECTION_RE = new RegExp('第\\s*[' + CN_NUM + ']+\\s*节');
const SUBJECT_KEYS = ['中国法制史', '法制史', '法理学', '法理', '宪法', '刑法', '民法', '民事诉讼法', '刑事诉讼法', '民诉', '刑诉', '综合课',
  '考研英语', '英语一', '英语二', '英语', '考研政治', '政治'];   /* 待补充：其它公共课名称 */

}
function detectSubjectIn(s) {
  const t = String(s || '');
  for (let i = 0; i < SUBJECT_KEYS.length; i++) {
    const k = SUBJECT_KEYS[i];
    if (t.indexOf(k) >= 0) {
      if (k === '法理') return '法理学';
      if (k === '法制史') return '中国法制史';
      if (k === '民诉') return '民事诉讼法';
      if (k === '刑诉') return '刑事诉讼法';
      if (k === '考研英语' || k === '英语一' || k === '英语二') return '英语';
      if (k === '考研政治') return '政治';
      return k;
    }
  }

}
/* 把「直链 URL」还原成文件名/路径，方便网盘直链直接粘贴；保留最后两级路径（章/节） */
function urlToName(u) {
  function dec(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  try {
    const x = new URL(String(u));
    const segs = (x.pathname || '').split('/').filter(Boolean).map(dec);
    if (!segs.length) return x.hostname;
    const tail = segs.slice(-2).join(' ');
    return stripExt(tail) || dec(segs[segs.length - 1]) || x.hostname;
  } catch (e) {
    const segs = String(u).split(/[?#]/)[0].split('/').filter(Boolean).map(dec);
    if (!segs.length) return String(u);
    return stripExt(segs.slice(-2).join(' '));
  }
}
function cleanBaseName(raw) {
  let s = stripExt(String(raw || '').trim());  s = s.replace(/[（(]?\s*(1080p|720p|4k|hdr|hd|标清|高清|超清|x264|x265|hevc)\s*[)）]?/ig, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  s = s.replace(/^\d{1,4}[\s._\-、,，)）]+\s*/, '');
  s = s.replace(/^[\s._\-—–、,，|]+/, '');
  return trimSep(s);
}
function parseLineParts(raw) {
  const whole = cleanBaseName(raw);
  const cm = whole.match(CHAPTER_RE);
  const sm = whole.match(SECTION_RE);
  let chapter = '', section = '';
  if (cm && sm) {
    if (sm.index > cm.index) {
      chapter = whole.slice(cm.index, sm.index);
      section = whole.slice(sm.index);
    } else {
      section = whole.slice(sm.index, cm.index);
      chapter = whole.slice(cm.index);
    }
  } else if (cm) {
    chapter = whole.slice(cm.index);
  } else if (sm) {
    section = whole.slice(sm.index);
  }
  return { whole: whole, chapter: trimSep(chapter), section: trimSep(section) };

/* 从文件名里读时长：支持 01:23:45 / 23:45 / 1小时23分 / 83分钟 / 1h23m / 45min
   返回 0 表示没解析到；解析结果夹在 1–600 分钟。 */
function durationFromName(name) {
  const s = String(name || '');
  if (!s) return 0;
  let m = s.match(/(?:^|[^0-9])(\d{1,2})\s*[:：]\s*(\d{2})\s*[:：]\s*(\d{2})(?:[^0-9]|$)/);
  if (m) {
    const sec = Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]);
    if (sec > 0) return clamp(Math.round(sec / 60), 1, 600);
  }
  m = s.match(/(?:^|[^0-9])(\d{1,4})\s*[:：]\s*(\d{2})(?:[^0-9]|$)/);
  if (m) {
    const sec = Number(m[1]) * 60 + Number(m[2]);
    if (sec > 0) return clamp(Math.round(sec / 60), 1, 600);
  }
  m = s.match(/(\d+(?:\.\d+)?)\s*(?:小时|時|h|hr|hours?)/i);
  if (m) {
    let min = Math.round(Number(m[1]) * 60);
    const mm = s.match(/(\d+)\s*(?:分钟|分|min|mins|minutes?|m)(?![a-z])/i);
    if (mm) min += Number(mm[1]);
    return clamp(min, 1, 600);
  }
  m = s.match(/(\d{1,4})\s*(?:分钟|分|min|mins|minutes?)(?![a-z])/i);
  if (m) return clamp(Math.round(Number(m[1])), 1, 600);
  return 0;
}
/* 把文件名里的时长片段从标题里去掉（预览与课程名更干净） */
function stripDurationText(name) {
  let s = ' ' + String(name || '') + ' ';
  s = s.replace(/(?:^|[^0-9])\d{1,2}\s*[:：]\s*\d{2}\s*[:：]\s*\d{2}(?:[^0-9]|$)/g, ' ');
  s = s.replace(/(?:^|[^0-9])\d{1,4}\s*[:：]\s*\d{2}(?:[^0-9]|$)/g, ' ');
  s = s.replace(/\d+(?:\.\d+)?\s*(?:小时|時|h|hr|hours?)(?:\s*\d+\s*(?:分钟|分|min|mins|minutes?|m))?/gi, ' ');
  s = s.replace(/\d{1,4}\s*(?:分钟|分|min|mins|minutes?)(?![a-z])/gi, ' ');

}

  if (!row || Number(row.minutes) > 0) return row;
  const min = durationFromName(row.original || row.section || row.name || '');
  if (min > 0) {
    row.minutes = min;
    row.minutesSource = 'text';
    if (row.section) row.section = stripDurationText(row.section) || row.section;
    if (row.name) row.name = stripDurationText(row.name) || row.name;
  }

function parseFilenames(text, subjectHint) {
  const rawLines = String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); })
    .filter(Boolean)
    .map(function (s) { return /^https?:\/\//i.test(s) ? urlToName(s) : s; });
  /* 网盘返回的「目录/文件名」：目录当作章节标题行插到它下面的文件前面 */
  const lines = [];
  let lastDir = '';
  rawLines.forEach(function (line) {
    if (line.indexOf('/') < 0) { lines.push(line); return; }
    const parts = line.split('/').filter(Boolean);
    const file = parts.pop();
    const dir = parts.length ? parts[parts.length - 1] : '';
    if (dir && dir !== lastDir) { lines.push(dir); lastDir = dir; }
    if (file) lines.push(file);
  });
  const out = { subject: '', rows: [] };
  if (!lines.length) return out;
  let subject = detectSubjectIn(subjectHint) || '';
  let start = 0;
  if (!subject) {
    const first = cleanBaseName(lines[0]);
    if (first.length <= 16 && !CHAPTER_RE.test(first) && !SECTION_RE.test(first)) {
      subject = detectSubjectIn(first) || first;
      start = 1;
    } else {
      subject = '未分类';
    }
  } else {
    const first = cleanBaseName(lines[0]);
    if (first.length <= 16 &&
        (detectSubjectIn(first) === subject ||
         (!CHAPTER_RE.test(first) && !SECTION_RE.test(first) && !hadVideoExt(lines[0])))) {
      start = 1;
    }
  }
  const rest = lines.slice(start);
  const marked = rest.some(function (l) { return CHAPTER_RE.test(l) || SECTION_RE.test(l); });

  /* 没有任何「第X章/第X节」标记：按需求采用「首行科目 + 后续行章节」的简单模式 */
  if (!marked && rest.length) {
    const hasVideo = rest.some(hadVideoExt);
    let curCh = '';
    rest.forEach(function (l) {
      const name = cleanBaseName(l) || l;
      if (!hasVideo) {
        out.rows.push({ subject: subject, chapter: name, section: name, original: l });
      } else if (hadVideoExt(l)) {
        out.rows.push({ subject: subject, chapter: curCh || '未分章', section: name, original: l });
      } else {
        curCh = name;
      }
    });
  } else {
    let curChapter = '', curSection = '';
    const pending = [];
    rest.forEach(function (raw) {
      const p = parseLineParts(raw);
      const lineSubject = detectSubjectIn(p.whole) || detectSubjectIn(raw) || subject;
      const video = hadVideoExt(raw);
      if (p.chapter && !p.section && !video && p.whole.length <= 30) {
        curChapter = p.chapter; curSection = ''; return;
      }
      if (p.section && !p.chapter && !video && p.whole.length <= 30) {
        curSection = p.section;
        pending.push({ chapter: curChapter, section: p.section });
        return;
      }
      if (p.chapter && p.section) {
        out.rows.push({ subject: lineSubject, chapter: p.chapter, section: p.section, original: raw });
        curChapter = p.chapter; curSection = p.section; return;
      }
      if (p.section) {
        out.rows.push({ subject: lineSubject, chapter: curChapter || '未分章', section: p.section, original: raw });
        curSection = p.section; return;
      }
      if (p.chapter) {
        out.rows.push({ subject: lineSubject, chapter: p.chapter, section: curSection || p.chapter, original: raw });
        curChapter = p.chapter; return;
      }
      if (!video && !curChapter && !curSection && p.whole.length <= 16) {
        curChapter = p.whole; return;
      }
      out.rows.push({
        subject: lineSubject,
        chapter: curChapter || '未分章',
        section: curSection || p.whole || raw,
        original: raw
      });
    });
    if (!out.rows.length && pending.length) {
      pending.forEach(function (p) {
        out.rows.push({ subject: subject, chapter: p.chapter || '未分章', section: p.section, original: p.section });
      });
    }
  }

  if (!out.rows.length) {
    rest.forEach(function (l) {
      const name = cleanBaseName(l) || l;
      out.rows.push({ subject: subject, chapter: '未分章', section: name, original: l });
    });
  }
  /* 去重（同科目/章/节） */
  const seen = new Set();
  out.rows = out.rows.filter(function (r) {
    const k = r.subject + '|' + r.chapter + '|' + r.section;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  out.subject = subject;
  if (out.subject === '未分类' && out.rows.length) out.subject = out.rows[0].subject;
  /* 文件名里带时长（如 01:23:45、83 分钟）→ 记为 text 来源 */
  out.rows.forEach(function (r) {
    applyNameMinutes(r);
    if (typeof r.minutes !== 'number') { r.minutes = 0; r.minutesSource = ''; }
  });
  return out;
}

    }
    if (secMatch && line.length <= 40) {

    }

  try {
    ocrJob = idx;
    const r = await fetch(HELPER_BASE + '/pdf?path=' + encodeURIComponent(f.path), { cache: 'no-store' });
    if (!r.ok) throw new Error('读取失败 HTTP ' + r.status);

    const pages = await ocrPdfPages(new Uint8Array(buf), {
      maxPages: 20,

      onProgress: function (done, total, msg) {

    if (!text || textQuality(text).cjk < 10) throw new Error('OCR 没有识别到足够的中文，建议改用粘贴文本导入');
    const info = analyzePdfPages(pages, f.fileName || f.name);

  } catch (err) {
    f.preview = null;
    f.error = String(err && err.message ? err.message : err);

  });

        };

      const info = f.preview;
      const dupHit = (state.pdfs || []).some(function (p) { return p.name === shown && Number(p.pageCount) === info.pageCount; });
      if (dupHit) { dup++; continue; }
      state.pdfs = state.pdfs || [];
      state.pdfs.push({
        id: uid('pdf'), name: shown, fileName: f.fileName, pageCount: info.pageCount, subject: info.subject || '未分类',
        chapters: (info.chapters || []).slice(0, 120),

        addedAt: Date.now(), path: f.path, manual: !!info.manual, ocr: !!info.ocr
      });
      added++;
    } catch (err) {
      failed.push(shown + '：' + (err && err.message ? err.message : err));
    }
  }
  save(true);
  /* 不改动扫描清单，避免用户改名丢失；只刷新卡片统计 */
  render();
  const parts = ['新增 ' + added + ' 份 PDF'];

  if (failed.length) parts.push('失败 ' + failed.length + ' 份');

  if (msgEl) {

      (dup ? '，' + dup + ' 份重复已跳过' : '') +

  }
}


async function handlePdfFile(file) {
  const status = document.getElementById('pdfStatus');
  if (status) status.textContent = '正在读取并提取文字…';
  try {
    const buf = await readAsArrayBuffer(file);
    const pages = await extractPdfPages(new Uint8Array(buf));
    const text = pages.map(function (p) { return p.text; }).join('\n\n').trim();
    const q = textQuality(text);
    if (!text || q.cjk < 10) {
      if (status) status.textContent = '没有提取到可用的中文文字（多为扫描版 PDF）。请展开下方「粘贴文本导入」。';
      toast('PDF 未提取到文字，请改用粘贴文本', 'warn');
      return;
    }
    const info = analyzePdfPages(pages, file.name);
    pendingPdfInfo = { name: file.name, info: info };
    if (status) {
      status.textContent = '已读取 ' + info.pageCount + ' 页、' + text.length + ' 个字符（中文占比 ' +
        Math.round(q.ratio * 100) + '%），识别到 ' + info.chapters.length + ' 个章节标记。';
    }
    /* 逐页解析题目，顺便记下每题所在页，供「推荐页码范围」使用 */
    const qs = [];
    pages.forEach(function (pg) {
      parseQuestionsFromText(pg.text).forEach(function (item) {
        item.page = pg.p;
        if (!item.subject || item.subject === '未分类') item.subject = info.subject || '未分类';
        qs.push(item);
      });
    });
    if (!qs.length) qs.push.apply(qs, parseQuestionsFromText(text));
    if (!qs.length) {
      if (status) status.textContent = '提取到文字，但没有识别出题号结构。可尝试粘贴文本并手动整理题号。';
      toast('未识别出题目结构', 'warn');
      return;
    }
    pendingPdf = qs;
    pendingPdfRange = { from: 0, to: 0 };
    renderPdfPreview();
  } catch (err) {
    console.error(err);
    if (status) status.textContent = '读取失败：' + (err && err.message ? err.message : err);
    toast('PDF 解析失败', 'err');
  }
}

/* ---------- PDF 页码范围推荐 ---------- */
function normChapterKey(s) {
  return String(s || '').replace(/\s+/g, '').replace(/[（(][^）)]*[）)]/g, '').replace(/^第/, '第');
}
function analyzePdfPages(pages, name) {
  const CN = '一二三四五六七八九十百零0-9';
  const chapterRe = new RegExp('(第\\s*[' + CN + ']+\\s*[章编部])\\s*(.*)$');
  let subject = '';
  const list = [];
  let curChapter = '';
  pages.forEach(function (pg) {
    let chapter = curChapter;
    const lines = pg.text.split('\n');
    for (let i = 0; i < lines.length && i < 30; i++) {
      const l = lines[i].trim();
      if (!l) continue;
      if (!subject) subject = detectSubjectIn(l) || '';
      if (l.length <= 40) {
        const cm = l.match(chapterRe);
        if (cm) { chapter = (cm[1] + ' ' + cm[2]).trim(); break; }
      }
    }
    curChapter = chapter;
    list.push({ p: pg.p, chapter: chapter });
  });
  const chapters = [];
  list.forEach(function (it) {
    const k = normChapterKey(it.chapter);
    if (!k) return;
    const last = chapters[chapters.length - 1];
    if (!last || normChapterKey(last.chapter) !== k) chapters.push({ chapter: it.chapter, from: it.p, to: it.p });
    else last.to = it.p;
  });
  return { name: name || '', pageCount: pages.length, pages: list, chapters: chapters, subject: subject || '未分类' };
}
/* 已学完章节 → PDF 页码范围；能对上章节文字就用章节匹配，否则按章序比例估算 */
function pdfRecommendations() {
  const out = [];
  const done = [];
  state.courses.filter(function (c) { return c.done; }).forEach(function (c) {
    const nk = normChapterKey(c.chapter);
    if (!done.some(function (d) { return d.subject === c.subject && d.nk === nk; })) {
      done.push({ subject: c.subject, chapter: c.chapter, nk: nk });
    }
  });
  const bySubject = {};
  state.courses.forEach(function (c) {
    const nk = normChapterKey(c.chapter);
    if (!bySubject[c.subject]) bySubject[c.subject] = [];
    if (!bySubject[c.subject].some(function (x) { return x.nk === nk; })) bySubject[c.subject].push({ chapter: c.chapter, nk: nk });
  });
  (state.pdfs || []).forEach(function (pdf) {
    done.forEach(function (dc) {
      let basis = '章节匹配';
      let from = 0, to = 0;
      const hit = (pdf.chapters || []).filter(function (ch) { return normChapterKey(ch.chapter) === dc.nk; });
      /* 章节对不上，且 PDF 本身标注了别的科目 → 不硬凑 */
      if (!hit.length && pdf.subject && pdf.subject !== '未分类' && pdf.subject !== dc.subject) return;
      if (hit.length) {

        to = hit[hit.length - 1].to;

      const key = pdf.id + '|' + dc.subject + '|' + dc.nk;
      const prog = (state.pdfProg || {})[key] || {};

        key: key, pdfId: pdf.id, name: pdf.name, subject: dc.subject, chapter: dc.chapter,
        from: from, to: to, pageCount: pdf.pageCount, basis: basis, manual: !!pdf.manual, ocr: !!pdf.ocr, pct: Number(prog.pct) || 0

/* 完成比例 → 「已完成到第几页」：按当前推荐页范围换算，超出 PDF 实际页数就截断 */

  if (f > pc) { f = pc; clamped = true; }

  return '已完成到第 ' + d.doneTo + ' 页（第 ' + d.from + '–' + d.doneTo + ' 页' + (d.clamped ? '，已按 PDF 共 ' + d.to + ' 页截断' : '') + '）';
}

let runner = null;
function currentQuestion() {

}
function snapshotQ(kind, id) {

    done: q ? !!q.done : false,
    attempts: q ? Number(q.attempts) || 0 : 0,
    wrong: q ? !!q.wrong : false,

}
function restoreQ(kind, id, snap) {

  const total = runner.items.length;

  runner.snapshot = snapshotQ(it.kind, it.id);
  runner.answered += 1;

  if (correct) runner.correctCount += 1;
  if (runner.mode === 'review') {
    runner.lastReview = reviewOutcome(it.kind, it.id, correct);
  } else {

  runner.answered = Math.max(0, runner.answered - 1);
  if (runner.lastCorrect) runner.correctCount = Math.max(0, runner.correctCount - 1);
  runner.graded = false;

  runner.snapshot = null;
  runner.overridden = false;
  runner.lastReview = null;

  const done = runner ? runner.answered : 0;

  closeModal();
  render();

}

  if (!raw) { toast('没有可恢复的修复前数据', 'warn'); return false; }

  try { obj = JSON.parse(raw); } catch (e) {}
  if (!obj) { toast('修复前数据已损坏，无法恢复', 'err'); return false; }
  state = coerceState(obj);
  save(true); queueSync(0); render();
  toast('已恢复修复前的数据', 'ok');
  return true;
}

/* ---------- 每日提醒：ntfy / Server 酱 / 企业微信 ---------- */
function reminderChannels() {
  const rm = state.meta.reminder || {};
  return [
    { key: 'ntfy', name: 'ntfy', ready: !!(rm.ntfyTopic && rm.ntfyServer) },
    { key: 'serverChan', name: 'Server 酱', ready: !!rm.serverChan },
    { key: 'wecom', name: '企业微信', ready: !!rm.wecom }
  ];
}
function reminderReadyChannels() {
  return reminderChannels().filter(function (c) { return c.ready; });
}
function reminderStateText() {
  const rm = state.meta.reminder || {};
  const ready = reminderReadyChannels().map(function (c) { return c.name; });
  const parts = [];
  parts.push(ready.length ? '已启用通道：' + ready.join(' / ') : '还没有通道：填 ntfy 主题、Server 酱或企业微信任一即可');
  parts.push('每天 ' + (rm.time || '20:00') + ' 提醒（网页打开时触发）');

  return parts.join('；');

/* 端点允许被 meta.reminder.ep 覆盖（测试或自建服务用） */
function reminderEndpoints() {
  const rm = state.meta.reminder || {};
  const ep = rm.ep || {};
  const base = String(rm.ntfyServer || 'https://ntfy.sh').replace(/\/+$/, '');
  return {
    ntfy: ep.ntfy || (base + '/' + encodeURIComponent(rm.ntfyTopic || '')),
    serverChan: ep.serverChan || ('https://sctapi.ftqq.com/' + encodeURIComponent(rm.serverChan || '') + '.send'),
    wecom: ep.wecom || rm.wecom || ''
  };
}
async function pushOnce(url, opts) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 9000);
  try {
    await fetch(url, Object.assign({ mode: 'no-cors', cache: 'no-store' }, opts || {}, ctrl ? { signal: ctrl.signal } : {}));
    return { ok: true };
  } catch (e) {
    return { ok: false, msg: String((e && e.message) || e) };
  } finally {
    clearTimeout(timer);
  }
}
async function sendViaChannel(key, title, text) {
  const ep = reminderEndpoints();
  if (key === 'ntfy') {
    if (!ep.ntfy) return { ok: false, msg: '未配置 ntfy 主题' };
    return pushOnce(ep.ntfy, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: title + '\n\n' + text });
  }
  if (key === 'serverChan') {
    if (!ep.serverChan) return { ok: false, msg: '未配置 Server 酱' };
    const u = ep.serverChan + (ep.serverChan.indexOf('?') >= 0 ? '&' : '?') +
      'title=' + encodeURIComponent(title) + '&desp=' + encodeURIComponent(text);
    return pushOnce(u, { method: 'GET' });
  }
  if (key === 'wecom') {
    if (!ep.wecom) return { ok: false, msg: '未配置企业微信' };
    return pushOnce(ep.wecom, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ msgtype: 'text', text: { content: title + '\n' + text } })
    });
  }
  return { ok: false, msg: '未知通道' };
}
async function sendAllChannels(title, text) {
  const ready = reminderReadyChannels();
  if (!ready.length) return { sent: 0, failed: 0, none: true };
  const results = await Promise.all(ready.map(function (c) { return sendViaChannel(c.key, title, text); }));
  const sent = results.filter(function (r) { return r.ok; }).length;
  return { sent: sent, failed: results.length - sent, none: false };
}
function reminderSummary() {
  const pi = planInfo();
  const due = dueReviews().length;
  const rec = recommendToday();
  const left = Math.max(0, pi.quota - pi.todayDone);
  const parts = [];
  if (left) parts.push('还需完成 ' + left + ' 项任务');
  if (due) parts.push(due + ' 道错题待复习');
  if (rec.re) parts.push('推荐真题 ' + rec.re + ' 道');
  if (rec.re) parts.push('推荐真题 ' + rec.re + ' 道');
  const title = pi.exam && pi.daysLeft >= 0
    ? '距考试 ' + pi.daysLeft + ' 天 · ' + (parts.length ? '今日任务待完成' : '今日任务已完成')
    : (parts.length ? '今日法硕学习任务待完成' : '今日法硕学习已完成');
  const desp = (parts.length ? parts.join('；') : '今天的学习计划已完成，早点休息。') +
    (pi.exam ? '\n考试日期：' + pi.exam : '') +
    '\n打开法硕备考工作台查看详情。';
  return { title: title, desp: desp, hasWork: parts.length > 0 };
}

function checkDailyReminder() {
  const rm = state.meta.reminder;
  if (!rm || !rm.enabled) return;
  if (navigator.onLine === false) return;   /* 离线时不尝试联网推送，也不报错 */
  const today = todayStr();
  if (rm.lastSent === today) return;
  const now = new Date();
  const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  if (hm < rm.time) return;
  const s = reminderSummary();
  if (!s.hasWork) return;
  if (!reminderReadyChannels().length) return;
  sendAllChannels(s.title, s.desp).then(function (r) {
    if (r.sent) {
      state.meta.reminder.lastSent = today;
      save(true);
      toast('已推送今日任务提醒', 'ok');
    }
  }).catch(function () { /* 离线/网络失败：静默，下次到点再试 */ });
}
function escapeICS(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
}
function downloadReminderICS() {
  const rm = state.meta.reminder || {};
  const pi = planInfo();
  const time = /^\d{1,2}:\d{2}$/.test(rm.time || '') ? rm.time : '20:00';
  const hp = time.split(':');
  const hh = pad2(Number(hp[0])), mm2 = pad2(Number(hp[1]));
  const start = todayStr().replace(/-/g, '') + 'T' + hh + mm2 + '00';
  const untilDate = pi.exam && pi.daysLeft >= 0 ? pi.exam : addDays(todayStr(), 60);
  const until = untilDate.replace(/-/g, '') + 'T235959Z';
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const desc = '打开法硕备考工作台，完成今日课程与错题复习' + (pi.exam ? '。考试日期：' + pi.exam : '');
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Fashuo Workbench//CN', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', 'UID:' + uid('rem') + '@fashuo.local', 'DTSTAMP:' + stamp,
    'DTSTART;TZID=Asia/Shanghai:' + start,
    'RRULE:FREQ=DAILY;UNTIL=' + until,
    'SUMMARY:' + escapeICS('法硕备考每日提醒'),
    'DESCRIPTION:' + escapeICS(desc),
    'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + escapeICS('开始今天的法硕学习'), 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  if (downloadFile('法硕每日提醒.ics', lines, 'text/calendar;charset=utf-8')) {
    toast('日历文件已下载，发到手机导入即可每天提醒', 'ok');
  }
}

/* ---------- 备份 / 恢复 / 示例 ---------- */
function exportData() {
  try {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '法硕备考备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    toast('备份已导出', 'ok');
  } catch (err) {
    toast('导出失败：' + err.message, 'err');
  }
}
function openImportModal() {
  openModal({
    title: '导入备份',
    body:
      '<form data-form="importdata" class="stack">' +
        '<label class="field">选择备份文件（.json）<input type="file" id="impFile" accept=".json,application/json"></label>' +
        '<label class="field">或粘贴 JSON 内容<textarea id="impText" placeholder=\'{"courses": [...], ...}\' style="min-height:120px"></textarea></label>' +
        '<div class="warnbox">导入会覆盖当前全部数据，请确认已导出需要保留的内容。</div>' +
        '<div class="row" style="justify-content:flex-end">' +
          '<button class="btn ghost" type="button" data-act="modal-close">取消</button>' +
          '<button class="btn primary" type="submit">导入并覆盖</button>' +
        '</div>' +
      '</form>'
  });
}
function submitImportData() {
  const fileEl = document.getElementById('impFile');
  const file = fileEl && fileEl.files && fileEl.files[0];
  const text = fieldVal('impText');
  const apply = function (raw) {
    let obj;
    try { obj = JSON.parse(raw); }
    catch (e) { toast('JSON 解析失败，请检查文件内容', 'err'); return; }
    state = coerceState(obj);
    save(true);
    closeModal();
    render();
    toast('备份已导入', 'ok');
  };
  if (file) file.text().then(apply).catch(function () { toast('读取文件失败', 'err'); });
  else if (text) apply(text);
  else toast('请选择文件或粘贴 JSON', 'warn');
}
function resetData() {
  askConfirm('清空全部数据？\n包括课程、学习时长、题库、错题队列和计划设置。\n此操作不可撤销，建议先导出备份。', '清空', true).then(function (ok) {
    if (!ok) return;
    state = defaultState();
    save(true);
    closeModal();
    render();
    toast('已清空全部数据');
  });
}
function loadSampleData() {
  const samples = [
    ['刑法', '第一章 刑法概述', '第一节 刑法的解释'],
    ['刑法', '第一章 刑法概述', '第二节 刑法的基本原则'],
    ['刑法', '第二章 犯罪构成', '第一节 犯罪客体'],
    ['刑法', '第二章 犯罪构成', '第二节 犯罪客观方面'],
    ['民法', '第一章 民法总则', '第一节 民事法律关系']
  ];
  let added = 0;
  samples.forEach(function (s) {
    const dup = state.courses.some(function (c) {
      return c.subject === s[0] && c.chapter === s[1] && c.section === s[2];
    });
    if (dup) return;
    state.courses.push({
      id: uid('c'), subject: s[0], chapter: s[1], section: s[2],
      original: s[2], name: s[2], video: '',
      seconds: 0, done: false, doneAt: '', createdAt: Date.now()
    });
    added++;
  });
  const sampleQs = [
    {
      kind: 'real', subject: '刑法', chapter: '第一章 刑法概述', section: '第一节 刑法的解释',
      stem: '简述刑法解释中的文理解释与论理解释的区别。',
      answer: '文理解释依据条文的字面含义进行解释；论理解释在字面含义基础上，依据立法精神、目的等对条文进行解释。'
    },
    {
      kind: 'real', subject: '刑法', chapter: '第一章 刑法概述', section: '第二节 刑法的基本原则',
      stem: '罪刑法定原则的基本内容有哪些？',
      answer: '法律明文规定为犯罪行为的，依照法律规定定罪处罚；法律没有明文规定的，不得定罪处罚。'
    },
    {
      kind: 'real', subject: '刑法', chapter: '第二章 犯罪构成', section: '第一节 犯罪客体',
      stem: '犯罪构成的共同要件包括哪些？',
      answer: '犯罪客体、犯罪客观方面、犯罪主体、犯罪主观方面。'
    }
  ];
  sampleQs.forEach(function (q) {
    const bank = bankOf(q.kind);
    const dup = bank.some(function (x) { return x.stem === q.stem; });
    if (dup) return;
    bank.push({
      id: uid('q'), subject: q.subject, chapter: q.chapter, section: q.section,
      stem: q.stem, answer: q.answer,
      name: (q.year || '') ? (q.year + ' 真题 · ' + q.subject) : ('真题 · ' + q.subject),
      year: Number(q.year) || 0, reviewTarget: Number(q.reviewTarget) || 3, reviewDone: 0,
      done: false, wrong: false, attempts: 0, createdAt: Date.now()
    });
  });
  save(true);
  render();
  toast(added ? '已载入示例课程 ' + added + ' 节和示例题目' : '示例数据已存在', 'ok');
}

/* ---------- 启动 ---------- */
/* manifest / 图标内联成 data: URI —— 单文件也能装成 App，不必额外上传文件 */
function injectPwaMeta() {
  try {
    const mf = {
      name: '法硕备考工作台', short_name: '法硕工作台',
      start_url: './', scope: './', display: 'standalone',
      background_color: '#f5f7fb', theme_color: '#5b7cfa', lang: 'zh-CN',
      icons: [{ src: APP_ICON_DATA, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
              { src: APP_ICON_DATA, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }],
      shortcuts: [{ name: '今日课表', url: './?tab=plan' }, { name: '复习提醒', url: './?tab=review' }]
    };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
    const ic = document.createElement('link');
    ic.rel = 'icon';
    ic.type = 'image/svg+xml';
    ic.href = APP_ICON_DATA;
    document.head.appendChild(ic);
    const ai = document.createElement('link');
    ai.rel = 'apple-touch-icon';
    ai.href = APP_ICON_DATA;
    document.head.appendChild(ai);
  } catch (e) {}
}
/* SW 只在 http(s) 下注册：file:// 打开时本就离线，不需要也不允许注册 */
function registerSw() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      swRegistration = reg;
      reg.addEventListener('updatefound', function () {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            toast('发现新版本，刷新后生效', 'ok');
          }
        });
      });
    }).catch(function () {});
  } catch (e) {}
}
function boot() {
  state = loadState();
  if (!state.ui.tab || !TAB_LABEL[state.ui.tab]) state.ui.tab = 'overview';
  if (state.points && !state.points.savedAt) settlePoints();  /* 首次迁移：把既有完成记录结算一次 */
  injectPwaMeta();
  registerSw();
  render();
  setTimeout(checkDailyReminder, 4000);
  setInterval(checkDailyReminder, 60 * 1000);
  /* 同步（S1）：先渲染本地数据，再后台与助手对齐 */
  if (SYNC_ON) {
    refreshSyncLabel();
    setTimeout(syncBootstrap, 700);
    setInterval(function () { if (!document.hidden) syncNow(false); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) syncNow(false);
    });
  } else {
    setSyncLabel('本机模式', 'off');
  }
  /* S6：网络状态变化即时反映到状态点（离线仍可用，改动排队） */
  window.addEventListener('online', function () { refreshSyncLabel(); toast('网络已恢复', 'ok'); if (SYNC_ON) queueSync(0); });
  window.addEventListener('offline', function () { refreshSyncLabel(); toast('已离线：继续用本地数据，联网后自动同步', 'warn'); });
}
window.addEventListener('beforeunload', function () { flushSave(); });
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(boot, 0);
}
</script>
